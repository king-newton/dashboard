<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>線上請假與簽核系統</title>
    <!-- 網頁瀏覽器分頁小圖示 (Favicon) -->
    <link rel="icon" type="image/png" href="https://king-newton.github.io/dashboard/icon-standard.png">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }
    </style>
</head>
<body class="bg-slate-100 min-h-screen p-4 md:p-8">

    <div class="max-w-4xl mx-auto space-y-8">
        
        <!-- 標頭 (簡化標題文字避免手機版折行) -->
        <div class="text-center bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
            <h1 class="text-xl md:text-2xl font-bold text-slate-800 flex items-center justify-center gap-2">
                <i class="fa-solid fa-file-signature text-emerald-600"></i> 線上請假與簽核系統
            </h1>
            <p class="text-sm text-slate-500 mt-1">串聯 Google 試算表 · 個人歷年請假統計 · 雙主管電子印章簽核</p>
        </div>

        <!-- 功能頁籤切換 -->
        <div class="flex border-b border-slate-200 bg-white rounded-xl p-1 shadow-sm">
            <button onclick="switchTab('apply')" id="tab-apply" class="flex-1 py-3 font-bold text-sm text-center rounded-lg bg-emerald-600 text-white transition">
                📝 員工請假申請
            </button>
            <button onclick="switchTab('approve')" id="tab-approve" class="flex-1 py-3 font-bold text-sm text-center rounded-lg text-slate-600 hover:bg-slate-50 transition">
                🛡️ 主管簽核儀表板
            </button>
        </div>

        <!-- 區塊一：員工請假申請表 -->
        <div id="section-apply" class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 space-y-4">
            <h2 class="text-lg font-bold text-slate-800 border-b pb-3">填寫請假單</h2>
            
            <form id="leaveForm" onsubmit="submitLeave(event)" class="space-y-4">
                
                <!-- 第一列：申請人姓名、假別、請假事由 -->
                <div class="grid grid-cols-1 md:grid-cols-12 gap-4">
                    <!-- 姓名（自動帶入並鎖定） -->
                    <div class="md:col-span-3">
                        <label class="block text-xs font-semibold text-slate-600 mb-1">申請人姓名</label>
                        <input type="text" id="empNameDisplay" readonly class="w-full bg-slate-200 p-3 rounded-xl border border-slate-300 text-sm font-bold text-slate-700 outline-none" />
                        <input type="hidden" id="empName" />
                    </div>

                    <!-- 假別 -->
                    <div class="md:col-span-3">
                        <label class="block text-xs font-semibold text-slate-600 mb-1">假別</label>
                        <select id="leaveType" required class="w-full bg-slate-50 p-3 rounded-xl border border-slate-200 text-sm outline-none focus:border-emerald-600">
                            <option value="特休假">特休假</option>
                            <option value="事假">事假</option>
                            <option value="病假">病假</option>
                            <option value="公假/公出">公假/公出</option>
                        </select>
                    </div>

                    <!-- 請假事由 -->
                    <div class="md:col-span-6">
                        <label class="block text-xs font-semibold text-slate-600 mb-1">請假事由</label>
                        <input type="text" id="leaveReason" placeholder="請簡述請假原因..." required class="w-full bg-slate-50 p-3 rounded-xl border border-slate-200 text-sm outline-none focus:border-emerald-600">
                    </div>
                </div>

                <!-- 個人歷史請假統計資訊顯示區 (無紀錄時自動隱藏) -->
                <div>
                    <div id="leaveSummaryCard" class="w-full bg-emerald-50 text-emerald-900 p-3 rounded-xl border border-emerald-200 text-xs space-y-1 hidden">
                        <div class="flex justify-between items-center font-bold">
                            <span>載入個人統計資料中...</span>
                            <i class="fa-solid fa-spinner fa-spin text-emerald-600"></i>
                        </div>
                    </div>
                </div>

                <!-- 第二列：開始日期、開始時間、結束日期、結束時間 -->
                <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">開始日期</label>
                        <input type="date" id="startDate" onchange="updateDateTime()" required class="w-full bg-slate-50 p-3 rounded-xl border border-slate-200 text-sm outline-none focus:border-emerald-600">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">開始時間</label>
                        <input type="time" id="startTime" value="08:30" onchange="updateDateTime()" required class="w-full bg-slate-50 p-3 rounded-xl border border-slate-200 text-sm outline-none focus:border-emerald-600">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">結束日期</label>
                        <input type="date" id="endDate" onchange="updateDateTime()" required class="w-full bg-slate-50 p-3 rounded-xl border border-slate-200 text-sm outline-none focus:border-emerald-600">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">結束時間</label>
                        <input type="time" id="endTime" value="17:30" onchange="updateDateTime()" required class="w-full bg-slate-50 p-3 rounded-xl border border-slate-200 text-sm outline-none focus:border-emerald-600">
                    </div>
                </div>

                <!-- 隱藏的完整時間欄位，供後端提交用 -->
                <input type="hidden" id="fullStartTime">
                <input type="hidden" id="fullEndTime">

                <!-- 第三列：請假總天數/時數 -->
                <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                    <div class="md:col-span-2">
                        <label class="block text-xs font-semibold text-slate-600 mb-1">請假總天數 (已扣除 12:00-13:30 午休)</label>
                        <input type="number" id="leaveDays" step="0.5" placeholder="自動計算天數" required class="w-full bg-slate-50 p-3 rounded-xl border border-slate-200 text-sm font-bold text-emerald-700 outline-none focus:border-emerald-600">
                    </div>
                </div>

                <button type="submit" id="submitBtn" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3.5 rounded-xl shadow transition cursor-pointer">
                    🚀 提交請假申請（送交雙主管簽核）
                </button>
            </form>
        </div>

        <!-- 區塊二：主管簽核儀表板 -->
        <div id="section-approve" class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 space-y-4 hidden">
            <h2 class="text-lg font-bold text-slate-800 border-b pb-3 flex items-center justify-between">
                <span>審核待辦清單</span>
                <button onclick="loadPendingLeaves()" class="text-xs bg-slate-100 hover:bg-slate-200 text-slate-600 px-3 py-1.5 rounded-lg border">
                    🔄 重整清單
                </button>
            </h2>

            <!-- 主管簽核角色連動選擇區 -->
            <div class="bg-slate-50 p-4 rounded-xl border border-slate-200 grid grid-cols-1 md:grid-cols-2 gap-4 text-xs">
                <div>
                    <label class="block font-bold text-slate-700 mb-1">簽核層級：</label>
                    <select id="managerStep" onchange="updateManagerNameOptions()" class="w-full p-2 rounded-lg border bg-white font-bold text-emerald-700">
                        <option value="1">第一層主管 (一階審核)</option>
                        <option value="2">第二層主管 (二階最終核准)</option>
                    </select>
                </div>
                <div>
                    <label class="block font-bold text-slate-700 mb-1">簽核主管姓名：</label>
                    <select id="managerNameSelect" onchange="syncManagerName()" class="w-full p-2 rounded-lg border bg-white font-bold text-slate-700">
                        <!-- 選項由 JS 自動帶入 -->
                    </select>
                    <input type="hidden" id="managerName" value="ERIC">
                </div>
            </div>

            <!-- 待簽核清單表格 -->
            <div class="overflow-x-auto">
                <table class="w-full text-left text-xs border-collapse">
                    <thead>
                        <tr class="bg-slate-100 text-slate-600 border-b">
                            <th class="p-3">單號</th>
                            <th class="p-3">姓名</th>
                            <th class="p-3">假別</th>
                            <th class="p-3">天數</th>
                            <th class="p-3">請假事由</th>
                            <th class="p-3">簽核進度</th>
                            <th class="p-3 text-center">操作</th>
                        </tr>
                    </thead>
                    <tbody id="pendingTableBody">
                        <tr>
                            <td colspan="7" class="p-6 text-center text-slate-400">點擊「重整清單」載入最新待審假單...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <script>
        const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwCpazOw8nEAirKT8j4ruNDwwB89KcA_LlmXPAHA7skjIKY2idXA23HyYctylp7aSPXgw/exec";
        const LEAVE_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSk18e6JMlqZrTZkMdMybrvXSX-HuZ5vLTawqbU116-Xwd9DHUf25hAjOO7HxQ6mJ6E6K0ll8Eu-Iy8/pub?gid=0&single=true&output=csv";

        const MANAGER_PHONES = {
            "ERIC": "",
            "李彥綸": "",
            "楊添仰": ""
        };

        window.addEventListener('DOMContentLoaded', () => {
            const loggedInName = localStorage.getItem('king_newton_emp_name');
            const isAuth = localStorage.getItem('king_newton_auth');

            if (isAuth !== 'true' || !loggedInName) {
                alert("您尚未登入系統，請先回到入口網進行身分驗證！");
                window.location.href = "index.html";
                return;
            }

            document.getElementById('empNameDisplay').value = loggedInName;
            document.getElementById('empName').value = loggedInName;

            const todayStr = new Date().toISOString().split('T')[0];
            document.getElementById('startDate').value = todayStr;
            document.getElementById('endDate').value = todayStr;
            document.getElementById('startTime').value = "08:30";
            document.getElementById('endTime').value = "17:30";
            updateDateTime();

            updateManagerNameOptions();
            fetchPersonalLeaveStats(loggedInName);
        });

        function updateManagerNameOptions() {
            const step = document.getElementById('managerStep').value;
            const selectEl = document.getElementById('managerNameSelect');
            selectEl.innerHTML = '';

            if (step === '1') {
                selectEl.add(new Option("ERIC (一階主管)", "ERIC"));
            } else {
                selectEl.add(new Option("李彥綸 (台北主管)", "李彥綸"));
                selectEl.add(new Option("楊添仰 (台南主管)", "楊添仰"));
            }
            syncManagerName();
        }

        function syncManagerName() {
            document.getElementById('managerName').value = document.getElementById('managerNameSelect').value;
        }

        function updateDateTime() {
            const startDate = document.getElementById('startDate').value;
            const startTime = document.getElementById('startTime').value;
            const endDate = document.getElementById('endDate').value;
            const endTime = document.getElementById('endTime').value;

            if (!startDate || !startTime || !endDate || !endTime) return;

            const fullStart = `${startDate}T${startTime}`;
            const fullEnd = `${endDate}T${endTime}`;

            document.getElementById('fullStartTime').value = fullStart;
            document.getElementById('fullEndTime').value = fullEnd;

            calculateLeaveDuration(startDate, startTime, endDate, endTime);
        }

// 精確計算請假時間（改用本地時間拆解，避免 UTC 時差錯誤）
        function calculateLeaveDuration(sDateStr, sTimeStr, eDateStr, eTimeStr) {
            const daysInput = document.getElementById('leaveDays');
            
            // 安全拆解年月日與時分，確保以「本地時間」建立日期物件
            const [sY, sM, sD] = sDateStr.split('-').map(Number);
            const [sH, sMin] = sTimeStr.split(':').map(Number);
            const start = new Date(sY, sM - 1, sD, sH, sMin);

            const [eY, eM, eD] = eDateStr.split('-').map(Number);
            const [eH, eMin] = eTimeStr.split(':').map(Number);
            const end = new Date(eY, eM - 1, eD, eH, eMin);

            if (end <= start) {
                alert("結束時間必須晚於開始時間！");
                daysInput.value = "";
                return;
            }

            let totalWorkHours = 0;
            let current = new Date(start);

            while (current < end) {
                let next = new Date(current.getTime() + 30 * 60 * 1000);
                if (next > end) next = end;

                const hours = current.getHours() + current.getMinutes() / 60;
                
                // 跳過午休 12:00 (12.0) 至 13:30 (13.5)
                if (!(hours >= 12.0 && hours < 13.5)) {
                    totalWorkHours += (next - current) / (1000 * 60 * 60);
                }

                current = next;
            }

            // 每日工時基準 7.5 小時
            let calculatedDays = totalWorkHours / 7.5;

            if (calculatedDays >= 1) {
                calculatedDays = Math.round(calculatedDays * 2) / 2;
            } else {
                calculatedDays = Math.round(calculatedDays * 10) / 10;
            }

            daysInput.value = calculatedDays;
        }
        async function fetchPersonalLeaveStats(name) {
            const summaryDiv = document.getElementById('leaveSummaryCard');

            try {
                const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(LEAVE_CSV_URL)}`;
                const response = await fetch(proxyUrl);
                const data = await response.json();
                
                if (!data.contents) throw new Error("無效資料");

                const rows = data.contents.split(/\r?\n/).map(row => row.split(','));
                const stats = {};
                let totalRecords = 0;

                for (let i = 1; i < rows.length; i++) {
                    const row = rows[i];
                    if (row.length < 2) continue;

                    const rowContent = row[1] ? row[1].replaceAll('"', '').trim() : '';

                    if (rowContent.includes(name)) {
                        totalRecords++;
                        let type = "其他請假";
                        if (rowContent.includes("特休")) type = "特休假";
                        else if (rowContent.includes("事假")) type = "事假";
                        else if (rowContent.includes("病假")) type = "病假";
                        else if (rowContent.includes("公假") || rowContent.includes("公出")) type = "公假/公出";

                        stats[type] = (stats[type] || 0) + 1;
                    }
                }

                if (totalRecords > 0) {
                    const detailHtml = Object.entries(stats).map(([type, count]) => 
                        `<span class="bg-emerald-100 text-emerald-800 px-2 py-0.5 rounded font-semibold mr-1.5">${type}: ${count} 次</span>`
                    ).join('');

                    summaryDiv.innerHTML = `
                        <div class="flex justify-between items-center font-bold text-emerald-800">
                            <span>👤 ${name} 歷史請假紀錄統計</span>
                            <span class="text-xs bg-emerald-600 text-white px-2 py-0.5 rounded-full">共 ${totalRecords} 筆記錄</span>
                        </div>
                        <div class="pt-1 flex flex-wrap gap-1">
                            ${detailHtml}
                        </div>
                    `;
                    summaryDiv.classList.remove('hidden');
                } else {
                    summaryDiv.innerHTML = '';
                    summaryDiv.classList.add('hidden');
                }

            } catch (error) {
                console.error("讀取請假統計失敗:", error);
                summaryDiv.innerHTML = '';
                summaryDiv.classList.add('hidden');
            }
        }

        function switchTab(tab) {
            if (tab === 'apply') {
                document.getElementById('section-apply').classList.remove('hidden');
                document.getElementById('section-approve').classList.add('hidden');
                document.getElementById('tab-apply').className = "flex-1 py-3 font-bold text-sm text-center rounded-lg bg-emerald-600 text-white transition";
                document.getElementById('tab-approve').className = "flex-1 py-3 font-bold text-sm text-center rounded-lg text-slate-600 hover:bg-slate-50 transition";
            } else {
                document.getElementById('section-apply').classList.add('hidden');
                document.getElementById('section-approve').classList.remove('hidden');
                document.getElementById('tab-approve').className = "flex-1 py-3 font-bold text-sm text-center rounded-lg bg-emerald-600 text-white transition";
                document.getElementById('tab-apply').className = "flex-1 py-3 font-bold text-sm text-center rounded-lg text-slate-600 hover:bg-slate-50 transition";
                loadPendingLeaves();
            }
        }

        function submitLeave(e) {
            e.preventDefault();
            const submitBtn = document.getElementById('submitBtn');
            submitBtn.innerText = "傳送中...";
            submitBtn.disabled = true;

            const empName = document.getElementById('empName').value;
            const leaveType = document.getElementById('leaveType').value;
            const days = document.getElementById('leaveDays').value;
            const reason = document.getElementById('leaveReason').value;

            const payload = {
                action: 'submitLeave',
                name: empName,
                type: leaveType,
                startTime: document.getElementById('fullStartTime').value,
                endTime: document.getElementById('fullEndTime').value,
                days: days,
                reason: reason
            };

            fetch(GAS_WEB_APP_URL, {
                method: 'POST',
                body: JSON.stringify(payload)
            })
            .then(res => res.json())
            .then(res => {
                alert(`🎉 ${res.message}\n單號：${res.leaveId}`);
                
                const waText = encodeURIComponent(`【請假審核通知】\n同仁：${empName}\n假別：${leaveType}\n天數：${days} 天\n事由：${reason}\n單號：${res.leaveId}\n請至金牛頓系統進行一階簽核。`);
                const ericPhone = MANAGER_PHONES["ERIC"] || "";
                
                if (confirm("是否立即開啟 WhatsApp 發送訊息通知一階主管 ERIC？")) {
                    const waUrl = ericPhone ? `https://wa.me/${ericPhone}?text=${waText}` : `https://api.whatsapp.com/send?text=${waText}`;
                    window.open(waUrl, '_blank');
                }

                document.getElementById('leaveForm').reset();
                
                const loggedInName = localStorage.getItem('king_newton_emp_name');
                document.getElementById('empNameDisplay').value = loggedInName;
                document.getElementById('empName').value = loggedInName;
                
                const todayStr = new Date().toISOString().split('T')[0];
                document.getElementById('startDate').value = todayStr;
                document.getElementById('endDate').value = todayStr;
                document.getElementById('startTime').value = "08:30";
                document.getElementById('endTime').value = "17:30";
                updateDateTime();

                fetchPersonalLeaveStats(loggedInName);
            })
            .catch(err => {
                alert("❌ 送出失敗，請再試一次。");
            })
            .finally(() => {
                submitBtn.innerText = "🚀 提交請假申請（送交雙主管簽核）";
                submitBtn.disabled = false;
            });
        }

        function loadPendingLeaves() {
            const tbody = document.getElementById('pendingTableBody');
            tbody.innerHTML = `<tr><td colspan="7" class="p-6 text-center text-slate-400">正在查詢待審核假單...</td></tr>`;

            fetch(`${GAS_WEB_APP_URL}?action=getPendingLeaves`)
                .then(res => res.json())
                .then(res => {
                    if (res.status === 'success' && res.data.length > 0) {
                        tbody.innerHTML = res.data.map(item => `
                            <tr class="border-b hover:bg-slate-50">
                                <td class="p-3 font-mono text-slate-500">${item.id}</td>
                                <td class="p-3 font-bold">${item.name}</td>
                                <td class="p-3">${item.type}</td>
                                <td class="p-3 text-emerald-700 font-bold">${item.days} 天</td>
                                <td class="p-3 text-slate-600">${item.reason}</td>
                                <td class="p-3">
                                    <span class="px-2 py-1 rounded bg-slate-100 text-slate-600">一階: ${item.step1Status}</span>
                                    <span class="px-2 py-1 rounded bg-slate-100 text-slate-600 ml-1">二階: ${item.step2Status}</span>
                                </td>
                                <td class="p-3 text-center">
                                    <button onclick="approveLeave('${item.id}', '${item.name}', '${item.type}', '${item.days}')" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-3 py-1.5 rounded-lg shadow text-xs">
                                        ✍️ 同意並蓋章
                                    </button>
                                </td>
                            </tr>
                        `).join('');
                    } else {
                        tbody.innerHTML = `<tr><td colspan="7" class="p-6 text-center text-slate-400">目前沒有需要簽核的假單 🎉</td></tr>`;
                    }
                });
        }

        function approveLeave(leaveId, applicantName, leaveType, leaveDays) {
            const managerName = document.getElementById('managerName').value;
            const step = parseInt(document.getElementById('managerStep').value);

            if (!managerName) {
                alert("請先確認簽核主管姓名！");
                return;
            }

            if (!confirm(`確定要以【第 ${step} 層主管：${managerName}】身份核准單號 ${leaveId} 嗎？`)) return;

            const payload = {
                action: 'approveLeave',
                leaveId: leaveId,
                step: step,
                managerName: managerName
            };

            fetch(GAS_WEB_APP_URL, {
                method: 'POST',
                body: JSON.stringify(payload)
            })
            .then(res => res.json())
            .then(res => {
                alert(`✅ 簽核完成！${res.message}`);

                if (step === 1) {
                    const targetManager = prompt("一階簽核成功！請問要透過 WhatsApp 通知哪位二階主管？\n請輸入：1 (李彥綸-台北) 或 2 (楊添仰-台南)", "1");
                    let nextManagerName = "";
                    
                    if (targetManager === "1") nextManagerName = "李彥綸";
                    else if (targetManager === "2") nextManagerName = "楊添仰";

                    if (nextManagerName) {
                        const waText = encodeURIComponent(`【請假二階簽核通知】\n一階主管 ${managerName} 已核准。\n申請同仁：${applicantName}\n假別：${leaveType} (${leaveDays}天)\n單號：${leaveId}\n請 ${nextManagerName} 主管至系統進行二階最終核准。`);
                        const nextPhone = MANAGER_PHONES[nextManagerName] || "";
                        const waUrl = nextPhone ? `https://wa.me/${nextPhone}?text=${waText}` : `https://api.whatsapp.com/send?text=${waText}`;
                        window.open(waUrl, '_blank');
                    }
                }

                loadPendingLeaves();
            });
        }
    </script>

</body>
</html>
