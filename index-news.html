<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>射出成型產業與重點廠商動態總覽</title>
    <link rel="icon" type="image/png" href="https://king-newton.github.io/dashboard/icon-standard.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-100 min-h-screen p-4 md:p-6 text-slate-800">

    <div class="max-w-5xl mx-auto space-y-6">
        
        <!-- 頂部標頭與返回按鈕 -->
        <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-3">
                <div class="w-12 h-12 bg-emerald-600 text-white rounded-xl flex items-center justify-center text-xl shadow-md">
                    <i class="fa-solid fa-industry"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold text-slate-800 m-0">射出成型產業與重點廠商即時動態</h1>
                    <p class="text-xs text-slate-500 m-0 mt-0.5">聚焦：富強鑫 · 全立發 · 華嶸 · 樺欽 · 智慧製造與綠色減碳技術</p>
                </div>
            </div>
            <a href="index.html" class="bg-slate-700 hover:bg-slate-800 text-white px-4 py-2 rounded-xl text-xs font-bold transition flex items-center gap-1.5 shadow-sm text-decoration-none">
                <i class="fa-solid fa-house"></i> 返回入口網
            </a>
        </div>

        <!-- 快速廠商捷徑標籤 -->
        <div class="flex flex-wrap gap-2">
            <button onclick="filterNews('all')" class="bg-emerald-600 text-white font-bold px-4 py-2 rounded-xl text-xs shadow-sm hover:bg-emerald-700 transition">全產業觀測</button>
            <button onclick="filterNews('富強鑫')" class="bg-white text-slate-700 font-bold px-4 py-2 rounded-xl text-xs border border-slate-200 hover:bg-emerald-50 transition">富強鑫 (FCS)</button>
            <button onclick="filterNews('全立發')" class="bg-white text-slate-700 font-bold px-4 py-2 rounded-xl text-xs border border-slate-200 hover:bg-emerald-50 transition">全立發 (CLF)</button>
            <button onclick="filterNews('華嶸')" class="bg-white text-slate-700 font-bold px-4 py-2 rounded-xl text-xs border border-slate-200 hover:bg-emerald-50 transition">華嶸 (Huarong)</button>
            <button onclick="filterNews('樺欽')" class="bg-white text-slate-700 font-bold px-4 py-2 rounded-xl text-xs border border-slate-200 hover:bg-emerald-50 transition">樺欽 (Hwa Chin)</button>
        </div>

        <!-- 即時動態網格卡片區 -->
        <div id="news-grid" class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <!-- 數據會由 JavaScript 自動載入或呈現預設產業焦點 -->
            <div class="col-span-1 md:col-span-2 text-center py-12 text-slate-400 font-bold">
                <i class="fa-solid fa-spinner fa-spin text-2xl text-emerald-600 mb-2"></i>
                <p>正在載入最新產業動態與廠商焦點...</p>
            </div>
        </div>

    </div>

    <script>
        // 預設關注的重點企業與主題關鍵字
        const TARGET_KEYWORDS = ['富強鑫', '全立發', '華嶸', '樺欽', '射出機', '微發泡成型'];

        // 載入 Google News RSS 透過 RSS2JSON API 轉為資料
        async function fetchIndustryNews() {
            const grid = document.getElementById('news-grid');
            grid.innerHTML = '';

            try {
                // 搜尋關鍵字：射出成型機 富強鑫 全立發 華嶸 樺欽
                const searchQuery = encodeURIComponent('射出成型機 OR 富強鑫 OR 全立發 OR 華嶸 OR 樺欽');
                const rssUrl = `https://news.google.com/rss/search?q=${searchQuery}&hl=zh-TW&gl=TW&ceid=TW:zh-Hant`;
                const apiUrl = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(rssUrl)}`;

                const response = await fetch(apiUrl);
                const data = await response.json();

                if (data.status === 'ok' && data.items.length > 0) {
                    renderNewsCards(data.items);
                } else {
                    renderFallbackNews();
                }
            } catch (err) {
                console.error("新聞拉取失敗：", err);
                renderFallbackNews();
            }
        }

        function renderNewsCards(items) {
            const grid = document.getElementById('news-grid');
            grid.innerHTML = items.slice(0, 10).map(item => {
                // 自動標記關聯廠商 Tag
                let matchedTag = "產業趨勢";
                if (item.title.includes("富強鑫")) matchedTag = "富強鑫";
                else if (item.title.includes("全立發")) matchedTag = "全立發";
                else if (item.title.includes("華嶸")) matchedTag = "華嶸";
                else if (item.title.includes("樺欽")) matchedTag = "樺欽";

                const pubDate = new Date(item.pubDate).toLocaleDateString('zh-TW');

                return `
                    <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 flex flex-col justify-between hover:shadow-md transition">
                        <div>
                            <div class="flex justify-between items-center mb-2">
                                <span class="bg-emerald-100 text-emerald-800 text-[10px] font-bold px-2.5 py-1 rounded-full">${matchedTag}</span>
                                <span class="text-xs text-slate-400"><i class="fa-regular fa-clock mr-1"></i>${pubDate}</span>
                            </div>
                            <h3 class="font-bold text-slate-800 text-base leading-snug mb-2 hover:text-emerald-600 transition">
                                <a href="${item.link}" target="_blank" class="text-slate-800 hover:text-emerald-600 text-decoration-none">${item.title}</a>
                            </h3>
                            <p class="text-xs text-slate-500 line-clamp-3">${item.description.replace(/<[^>]*>?/gm, '')}</p>
                        </div>
                        <div class="mt-4 pt-3 border-t border-slate-100 flex justify-between items-center text-xs">
                            <span class="text-slate-400 font-semibold">${item.author || '產業新聞來源'}</span>
                            <a href="${item.link}" target="_blank" class="text-emerald-600 font-bold hover:underline flex items-center gap-1">
                                閱讀全文 <i class="fa-solid fa-arrow-up-right-from-square text-[10px]"></i>
                            </a>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function renderFallbackNews() {
            // 如果聯外網抓取有擋，顯示預載重點廠商趨勢速覽
            const grid = document.getElementById('news-grid');
            grid.innerHTML = `
                <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
                    <span class="bg-emerald-100 text-emerald-800 text-[10px] font-bold px-2.5 py-1 rounded-full">富強鑫 (FCS)</span>
                    <h3 class="font-bold text-slate-800 text-base mt-2">智慧自檢成型機與全電/雙色機海外擴展</h3>
                    <p class="text-xs text-slate-500 mt-1">主打 SA-160 AI 品質自檢型注塑機，聚焦汽車輕量化與微發泡材料拉貨動能，海外布局拓展歐洲與印度新廠。</p>
                </div>
                <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
                    <span class="bg-emerald-100 text-emerald-800 text-[10px] font-bold px-2.5 py-1 rounded-full">華嶸 (Huarong)</span>
                    <h3 class="font-bold text-slate-800 text-base mt-2">微物理發泡技術與髮夾雙射自動化產線</h3>
                    <p class="text-xs text-slate-500 mt-1">展示微物理發泡射出成型與轉盤立式機型，專注於汽車燈罩雙射與節能減碳高精度鎖模技術。</p>
                </div>
                <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
                    <span class="bg-emerald-100 text-emerald-800 text-[10px] font-bold px-2.5 py-1 rounded-full">樺欽 (Hwa Chin)</span>
                    <h3 class="font-bold text-slate-800 text-base mt-2">HC-SE / HRW-SE 單雙色節能伺服射出機</h3>
                    <p class="text-xs text-slate-500 mt-1">主打寬模壁節能伺服與多色節能射出系統，深耕廣大在地工廠與高耐用度鎖模結構。</p>
                </div>
                <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
                    <span class="bg-emerald-100 text-emerald-800 text-[10px] font-bold px-2.5 py-1 rounded-full">全立發 (CLF)</span>
                    <h3 class="font-bold text-slate-800 text-base mt-2">超大型與多組分射出成型解決方案</h3>
                    <p class="text-xs text-slate-500 mt-1">持續優化大型曲手與雙缸射出結構，廣泛應用於大型塑膠件、家電與汽車鈑件射出。</p>
                </div>
            `;
        }

        function filterNews(keyword) {
            // 可在此新增特定關鍵字過濾邏輯
            if (keyword === 'all') fetchIndustryNews();
            else alert(`正在篩選包含【${keyword}】的最新產業新聞...`);
        }

        window.addEventListener('DOMContentLoaded', fetchIndustryNews);
    </script>
</body>
</html>
