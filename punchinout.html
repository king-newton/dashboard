<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>公司每日出勤打卡</title>
    <!-- 網頁瀏覽器分頁小圖示 (Favicon) -->
    <link rel="icon" type="image/png" href="https://king-newton.github.io/dashboard/icon-standard.png">
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; 
            max-width: 600px; 
            margin: 20px auto; 
            padding: 15px; 
            background: #f4f7f6; 
        }
        .card { 
            background: white; 
            padding: 20px; 
            border-radius: 12px; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.08); 
            margin-bottom: 20px;
        }
        h2 {
            margin-top: 0;
            color: #333;
            font-size: 22px;
            text-align: center;
        }
        .form-group { 
            margin-bottom: 20px; 
        }
        label { 
            display: block; 
            margin-bottom: 8px; 
            font-weight: bold; 
            color: #444;
        }
        select, input[type="text"] { 
            width: 100%; 
            padding: 12px; 
            box-sizing: border-box; 
            border: 1px solid #ddd; 
            border-radius: 6px; 
            font-size: 16px; 
            background: #fff;
        }
        button { 
            background: #007bff; 
            color: white; 
            border: none; 
            padding: 12px 20px; 
            border-radius: 6px; 
            cursor: pointer; 
            font-size: 16px; 
            width: 100%;
        }
        button:hover { 
            background: #0056b3; 
        }
        .loc-btn {
            background: #28a745;
            margin-bottom: 8px;
        }
        .loc-btn:hover {
            background: #218838;
        }
        .sheet-btn {
            background: #ffc107;
            color: #333;
            text-decoration: none;
            display: block;
            text-align: center;
            padding: 12px 20px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 16px;
            margin-top: 10px;
        }
        .sheet-btn:hover {
            background: #e0a800;
        }
        #locationText { 
            font-size: 14px; 
            color: #666; 
            margin-top: 5px; 
            background: #f8f9fa;
            padding: 10px;
            border-radius: 6px;
            border: 1px dashed #ccc;
            word-break: break-all;
        }
        #status { 
            margin-top: 15px; 
            color: #28a745; 
            font-weight: bold; 
            text-align: center; 
        }
    </style>
</head>
<body>

<div class="card">
    <h2>🚀 公司出勤與狀態回報</h2>
    <form id="checkinForm">
        <!-- 員工姓名改為自動讀取登入身分並鎖定 -->
        <div class="form-group">
            <label for="empNameDisplay">員工姓名：</label>
            <input type="text" id="empNameDisplay" readonly style="background: #e9ecef; font-weight: bold; color: #495057;" />
            <input type="hidden" id="empName" /> <!-- 隱藏欄位供背景送出使用 -->
        </div>

        <div class="form-group">
            <label for="workStatus">出勤狀態：</label>
            <select id="workStatus" required>
                <option value="" disabled selected>-- 請選擇目前的狀態 --</option>
                <option value="上班">上班</option>
                <option value="下班">下班</option>
                <option value="加班">加班</option>
                <option value="出差">出差</option>
                <option value="休假">休假</option>
                <option value="病假">病假</option>
                <option value="公出">公出</option>
            </select>
        </div>

        <div class="form-group">
            <label>打卡位置：</label>
            <button type="button" class="loc-btn" onclick="getLocation()">📍 取得目前位置並打卡</button>
            <div id="locationText">尚未取得位置</div>
        </div>

        <button type="submit">送出今日紀錄</button>
        <p id="status"></p>
    </form>
</div>

<!-- 主管/全員即時總表按鈕專區 -->
<div class="card" style="text-align: center;">
    <h3 style="margin-top: 0; color: #333; font-size: 18px;">📋 出勤紀錄查詢</h3>
    <p style="font-size: 14px; color: #666;">點擊下方按鈕即可隨時在新視窗查看出勤總表圖片檔：</p>
    <!-- 已將格式從 format=pdf 改為 format=jpeg -->
    <a href="https://docs.google.com/spreadsheets/d/1dwedE1cB0-UaO3C8pp6hw2nPVex2o0pXDZaffzoiTuc/export?format=jpeg" target="_blank" class="sheet-btn">
        🖼️ 開啟即時出勤總表圖片檔
    </a>
</div>

<script>
    // 頁面載入時自動檢查登入狀態並帶入姓名
    window.addEventListener('DOMContentLoaded', () => {
        const loggedInName = localStorage.getItem('king_newton_emp_name');
        const isAuth = localStorage.getItem('king_newton_auth');

        if (isAuth !== 'true' || !loggedInName) {
            alert("您尚未登入系統，請先回到入口網進行驗證！");
            window.location.href = "index.html"; // 未登入自動引導回首頁
            return;
        }

        // 自動填入並鎖定姓名顯示
        document.getElementById('empNameDisplay').value = loggedInName;
        document.getElementById('empName').value = loggedInName;
    });

    let currentCoords = "";
    let currentAddress = "";

    // 取得地理位置並透過免費 API 轉為中文地址
    function getLocation() {
        const locText = document.getElementById("locationText");
        if (navigator.geolocation) {
            locText.innerText = "正在取得 GPS 定位中，請稍候...";
            
            navigator.geolocation.getCurrentPosition(
                (position) => {
                    const lat = position.coords.latitude;
                    const lon = position.coords.longitude;
                    currentCoords = `緯度: ${lat.toFixed(4)}, 經度: ${lon.toFixed(4)}`;
                    
                    locText.innerText = "定位成功，正在轉換為中文地址...";

                    fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}&accept-language=zh-TW`)
                        .then(response => response.json())
                        .then(data => {
                            if (data && data.display_name) {
                                currentAddress = data.display_name;
                                locText.innerText = `📍 打卡地址：${currentAddress}`;
                            } else {
                                locText.innerText = `📍 座標：${currentCoords} (無法解析詳細地址)`;
                            }
                        })
                        .catch(err => {
                            locText.innerText = `📍 座標：${currentCoords} (地址轉換連線失敗)`;
                        });
                },
                (error) => {
                    switch(error.code) {
                        case error.PERMISSION_DENIED:
                            locText.innerText = "❌ 失敗：您拒絕了定位權限，請至瀏覽器設定開啟。";
                            break;
                        case error.POSITION_UNAVAILABLE:
                            locText.innerText = "❌ 失敗：找不到 GPS 訊號，請確認手機定位已開啟。";
                            break;
                        case error.TIMEOUT:
                            locText.innerText = "❌ 失敗：取得位置逾時，請再試一次。";
                            break;
                        default:
                            locText.innerText = "❌ 失敗：發生未知錯誤。";
                            break;
                    }
                },
                {
                    enableHighAccuracy: true,
                    timeout: 10000,
                    maximumAge: 0
                }
            );
        } else {
            locText.innerText = "❌ 您的瀏覽器不支援地理定位功能。";
        }
    }

    // 表單送出事件
    document.getElementById("checkinForm").addEventListener("submit", function(e) {
        e.preventDefault();
        
        const name = document.getElementById("empName").value;
        const statusType = document.getElementById("workStatus").value;
        const nowTime = new Date().toLocaleString();

        if (!currentAddress && !currentCoords) {
            alert("請先點擊「取得目前位置並打卡」取得定位後再送出！");
            return;
        }

        const payload = {
            time: nowTime,
            name: name,
            status: statusType,
            location: currentAddress || currentCoords
        };

        const scriptURL = 'https://script.google.com/macros/s/AKfycbxGzLW4QUO3DCSSoTtEhosM8bmAigYN7rSpdirkmU9BrQdkxQX2KA7-UvCepSiS1KHDsQ/exec';

        document.getElementById("status").innerText = "正在傳送資料至雲端...";

        fetch(scriptURL, {
            method: 'POST',
            mode: 'no-cors',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify(payload)
        })
        .then(response => {
            document.getElementById("status").innerText = "🎉 送出成功！資料已存入雲端試算表。";
            
            // 送出成功後自動開啟 JPG 圖片格式的出勤總表
            window.open('https://docs.google.com/spreadsheets/d/1dwedE1cB0-UaO3C8pp6hw2nPVex2o0pXDZaffzoiTuc/export?format=jpeg', '_blank');

            document.getElementById("checkinForm").reset();
            
            // 重新將登入者姓名回填（因為表單 reset 會清空欄位）
            const loggedInName = localStorage.getItem('king_newton_emp_name');
            document.getElementById('empNameDisplay').value = loggedInName;
            document.getElementById('empName').value = loggedInName;

            document.getElementById("locationText").innerText = "尚未取得位置";
            currentAddress = "";
            currentCoords = "";
        })
        .catch(error => {
            console.error('Error!', error);
            document.getElementById("status").innerText = "❌ 送出失敗，請再試一次。";
        });
    });
</script>

</body>
</html>
