<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>金牛頓工業 | 出差申請與簽核</title>
    <link rel="icon" type="image/png" href="https://king-newton.github.io/dashboard/icon-standard.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #f0f4f8; color: #334155; }
        .tab-btn.active { background-color: #00a600; color: #ffffff; font-weight: bold; }
        #auth-modal {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(8px);
            z-index: 100;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }
    </style>
</head>
<body class="pb-12">

    <div id="auth-modal">
        <div class="bg-white rounded-3xl p-6 md:p-8 w-full max-w-sm shadow-2xl border border-slate-100 text-center space-y-4">
            <div class="w-14 h-14 bg-emerald-100 text-[#00a600] rounded-2xl flex items-center justify-center mx-auto text-xl shadow-sm">
                <i class="fa-solid fa-lock"></i>
            </div>
            <div>
                <h2 class="text-lg font-extrabold text-slate-800 m-0">金牛頓出差簽核系統</h2>
                <p class="text-xs text-slate-500 mt-1 m-0">請輸入您的工號與姓名進行身份確認</p>
            </div>
            <form onsubmit="verifyEmp(event)" class="space-y-3">
                <div>
                    <input type="text" id="emp-id-input" placeholder="請輸入工號 (例: E001)" required autocomplete="off" class="w-full bg-slate-50 border border-slate-200 text-center text-sm py-2.5 px-4 rounded-xl outline-none focus:border-[#00a600] focus:bg-white transition">
                </div>
                <div>
                    <input type="text" id="emp-name-input" placeholder="請輸入姓名" required autocomplete="off" class="w-full bg-slate-50 border border-slate-200 text-center text-sm py-2.5 px-4 rounded-xl outline-none focus:border-[#00a600] focus:bg-white transition">
                </div>
                <div id="auth-msg" class="text-xs font-bold text-rose-500 min-h-[16px]"></div>
                <button type="submit" class="w-full bg-[#00a600] hover:bg-[#008f00] text-white font-bold py-3 rounded-xl shadow-lg shadow-emerald-600/30 transition cursor-pointer text-sm">
                    確認並進入系統
                </button>
            </form>
        </div>
    </div>

    <header class="bg-[#00a600] text-white px-3 sm:px-4 py-2.5 shadow-md flex items-center justify-between sticky top-0 z-40 gap-2">
        <div id="logout-trigger" class="flex items-center gap-2 min-w-0 cursor-pointer select-none" title="長按 2 秒可清除登入狀態重新驗證">
            <img src="https://king-newton.github.io/dashboard/icon-standard.png" class="h-6 w-auto rounded bg-white/20 p-0.5 shrink-0">
            <span class="font-bold text-sm sm:text-base tracking-wide truncate">出差申請與簽核</span>
            <span id="user-display" class="hidden md:inline-block text-xs bg-white/20 px-2.5 py-0.5 rounded-full font-medium shrink-0">
                尚未登入
            </span>
        </div>

        <div class="flex items-center gap-1.5 sm:gap-2 shrink-0">
            <a href="index.html" class="bg-white text-[#00a600] hover:bg-emerald-50 px-2.5 py-1.5 rounded-lg text-xs font-bold transition flex items-center gap-1 shadow-sm no-underline">
                <i class="fa-solid fa-house"></i>
                <span>入口網</span>
            </a>
            <button type="button" onclick="logoutSystem()" class="bg-white/20 hover:bg-white/30 text-white border border-white/40 px-2.5 py-1.5 rounded-lg text-xs font-bold transition flex items-center gap-1 cursor-pointer shadow-sm">
                <i class="fa-solid fa-right-from-bracket"></i>
                <span>EXIT</span>
            </button>
        </div>
    </header>

    <main class="max-w-xl mx-auto p-4 space-y-4">

        <div class="md:hidden flex items-center justify-between bg-white px-3.5 py-2 rounded-xl border border-slate-200 text-xs text-slate-600 shadow-sm">
            <span>目前登入身分</span>
            <span id="user-display-mobile" class="font-bold text-[#00a600]">尚未登入</span>
        </div>

        <div class="flex bg-slate-200 p-1 rounded-xl text-xs font-semibold text-slate-600">
            <button type="button" onclick="switchTab('apply')" id="tab-apply" class="tab-btn active flex-1 py-2 rounded-lg transition cursor-pointer">填寫出差單</button>
            <button type="button" onclick="switchTab('review')" id="tab-review" class="tab-btn flex-1 py-2 rounded-lg transition cursor-pointer">簽核與審核紀錄</button>
        </div>

        <section id="sec-apply" class="bg-white rounded-2xl p-5 shadow-sm border border-slate-200 space-y-4">
            <h2 class="text-base font-bold text-slate-800 border-b pb-2 flex items-center gap-2">
                <i class="fa-solid fa-paper-plane text-[#00a600]"></i> 新增出差申請
            </h2>

            <form id="tripForm" onsubmit="submitTrip(event)" class="space-y-3 text-xs">
                <div>
                    <label class="block font-bold text-slate-700 mb-1">所屬廠區</label>
                    <div class="flex gap-4">
                        <label class="flex items-center gap-1 cursor-pointer"><input type="radio" name="factory" value="台北" checked class="accent-[#00a600]"> 台北</label>
                        <label class="flex items-center gap-1 cursor-pointer"><input type="radio" name="factory" value="台中" class="accent-[#00a600]"> 台中</label>
                        <label class="flex items-center gap-1 cursor-pointer"><input type="radio" name="factory" value="台南" class="accent-[#00a600]"> 台南</label>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block font-bold text-slate-700 mb-1">開始日期</label>
                        <input type="date" id="startDate" required onchange="calcDays()" class="w-full border border-slate-300 rounded-lg p-2 outline-none focus:border-[#00a600]">
                    </div>
                    <div>
                        <label class="block font-bold text-slate-700 mb-1">結束日期</label>
                        <input type="date" id="endDate" required onchange="calcDays()" class="w-full border border-slate-300 rounded-lg p-2 outline-none focus:border-[#00a600]">
                    </div>
                </div>

                <div class="text-right text-slate-500 font-semibold" id="dayCountText">共計：0 天</div>

                <div>
                    <label class="block font-bold text-slate-700 mb-1">行程地點 (起 ↔ 訖)</label>
                    <input type="text" id="route" placeholder="例：新店 ↔ 彰化 / 新化產線" required class="w-full border border-slate-300 rounded-lg p-2 outline-none focus:border-[#00a600]">
                </div>

                <div>
                    <label class="block font-bold text-slate-700 mb-1">出差事由與主要工作內容</label>
                    <textarea id="reason" rows="2" placeholder="請填寫具體任務事項..." required class="w-full border border-slate-300 rounded-lg p-2 outline-none focus:border-[#00a600]"></textarea>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block font-bold text-slate-700 mb-1">主要交通工具</label>
                        <select id="transport" class="w-full border border-slate-300 rounded-lg p-2 outline-none focus:border-[#00a600]">
                            <option value="高鐵">高鐵</option>
                            <option value="自行開車">自行開車</option>
                            <option value="公司車">公司車</option>
                            <option value="台鐵/客運">台鐵 / 客運</option>
                        </select>
                    </div>
                    <div>
                        <label class="block font-bold text-slate-700 mb-1">預估費用 / 預支需求</label>
                        <input type="text" id="expense" placeholder="如：無 或 預支 3,000 元" class="w-full border border-slate-300 rounded-lg p-2 outline-none focus:border-[#00a600]">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-3 pt-1">
                    <div>
                        <label class="block font-bold text-slate-700 mb-1">第一職務代理人</label>
                        <select id="proxy1" required class="w-full border border-slate-300 rounded-lg p-2 outline-none focus:border-[#00a600]">
                            <option value="">請選擇同仁</option>
                            <option value="李彥綸">李彥綸 (E001)</option>
                            <option value="楊添仰">楊添仰 (E002)</option>
                            <option value="陳品鈞">陳品鈞 (E003)</option>
                            <option value="陳秀燕">陳秀燕 (E005)</option>
                            <option value="高欣宜">高欣宜 (E006)</option>
                            <option value="余品橋">余品橋 (E011)</option>
                            <option value="陳慧真">陳慧真 (E012)</option>
                            <option value="ERIC">ERIC (E020)</option>
                            <option value="陳靖昂">陳靖昂 (E023)</option>
                            <option value="何成偉">何成偉 (E026)</option>
                            <option value="李佩娟">李佩娟 (E029)</option>
                            <option value="曾晨杰">曾晨杰 (E033)</option>
                            <option value="戴政宏">戴政宏 (E035)</option>
                            <option value="詹淑敏">詹淑敏 (E036)</option>
                        </select>
                    </div>
                    <div>
                        <label class="block font-bold text-slate-700 mb-1">第二職務代理人 (超過3天)</label>
                        <select id="proxy2" class="w-full border border-slate-300 rounded-lg p-2 outline-none focus:border-[#00a600]">
                            <option value="">無</option>
                            <option value="李彥綸">李彥綸 (E001)</option>
                            <option value="楊添仰">楊添仰 (E002)</option>
                            <option value="陳品鈞">陳品鈞 (E003)</option>
                            <option value="陳秀燕">陳秀燕 (E005)</option>
                            <option value="高欣宜">高欣宜 (E006)</option>
                            <option value="余品橋">余品橋 (E011)</option>
                            <option value="陳慧真">陳慧真 (E012)</option>
                            <option value="ERIC">ERIC (E020)</option>
                            <option value="陳靖昂">陳靖昂 (E023)</option>
                            <option value="何成偉">何成偉 (E026)</option>
                            <option value="李佩娟">李佩娟 (E029)</option>
                            <option value="曾晨杰">曾晨杰 (E033)</option>
                            <option value="戴政宏">戴政宏 (E035)</option>
                            <option value="詹淑敏">詹淑敏 (E036)</option>
                        </select>
                    </div>
                </div>

                <button type="submit" id="submitBtn" class="w-full bg-[#00a600] hover:bg-[#008f00] text-white font-bold py-3 rounded-xl shadow-md transition text-sm cursor-pointer mt-2">
                    送出出差申請
                </button>
            </form>
        </section>

        <section id="sec-review" class="bg-white rounded-2xl p-5 shadow-sm border border-slate-200 space-y-4 hidden">
            <h2 class="text-base font-bold text-slate-800 border-b pb-2 flex items-center justify-between">
                <span class="flex items-center gap-2"><i class="fa-solid fa-list-check text-[#00a600]"></i> 審核與簽核紀錄</span>
                <button type="button" onclick="loadTripRecords()" class="text-xs text-[#00a600] hover:underline cursor-pointer"><i class="fa-solid fa-rotate-right"></i> 重新整理</button>
            </h2>

            <div id="recordList" class="space-y-3 text-xs">
                <div class="text-center text-slate-400 py-6">資料載入中...</div>
            </div>
        </section>

    </main>

    <script>
        const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxTS3PsYZxik44YUGnLxtfS9UsdlK-6P_EHrcHjONLoEqsD2sENhXyvQLGaEGzMfZAxZQ/exec";
        const CSV_DATA_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQsSgTxCHRQ0C1bGVPDauhJYlxqurA4ZTa34QQhG3Moh83AxU4zpr_QD4pX9VG6q6Hkj8M9T8j_hqc1/pub?gid=1209137580&single=true&output=csv";

        const LEVEL1_MANAGER_IDS = ["E020"];
        const LEVEL2_MANAGER_IDS = ["E001", "E002"];

        const MANAGER_PHONES = {
            "ERIC": "",
            "李彥綸": "",
            "楊添仰": ""
        };

        const EMPLOYEE_LIST = [
            { id: "E001", name: "李彥綸" },
            { id: "E002", name: "楊添仰" },
            { id: "E003", name: "陳品鈞" },
            { id: "E005", name: "陳秀燕" },
            { id: "E006", name: "高欣宜" },
            { id: "E011", name: "余品橋" },
            { id: "E012", name: "陳慧真" },
            { id: "E020", name: "ERIC" },
            { id: "E023", name: "陳靖昂" },
            { id: "E026", name: "何成偉" },
            { id: "E029", name: "李佩娟" },
            { id: "E033", name: "曾晨杰" },
            { id: "E035", name: "戴政宏" },
            { id: "E036", name: "詹淑敏" }
        ];

        let currentUser = { id: "", name: "" };
        let calculatedDays = 0;

        function clearAuthStorage() {
            localStorage.removeItem('king_newton_auth');
            localStorage.removeItem('king_newton_emp_id');
            localStorage.removeItem('king_newton_emp_name');
        }

        function showLoginModal() {
            currentUser = { id: "", name: "" };
            document.getElementById('user-display').innerText = "尚未登入";
            document.getElementById('user-display-mobile').innerText = "尚未登入";
            document.getElementById('auth-modal').style.display = 'flex';
        }

        function applyUserSession(empId, empName) {
            currentUser = { id: empId, name: empName };
            const label = `${empId} ${empName}`;
            document.getElementById('user-display').innerText = label;
            document.getElementById('user-display-mobile').innerText = label;
            document.getElementById('auth-modal').style.display = 'none';
            refreshProxyOptions();
        }

        function refreshProxyOptions() {
            const p1 = document.getElementById('proxy1');
            const p2 = document.getElementById('proxy2');
            const prev1 = p1.value;
            const prev2 = p2.value;

            p1.innerHTML = '<option value="">請選擇同仁</option>';
            p2.innerHTML = '<option value="">無</option>';

            EMPLOYEE_LIST.forEach(emp => {
                if (emp.name.toUpperCase() !== currentUser.name.toUpperCase() && emp.id.toUpperCase() !== currentUser.id.toUpperCase()) {
                    p1.add(new Option(`${emp.name} (${emp.id})`, emp.name));
                    p2.add(new Option(`${emp.name} (${emp.id})`, emp.name));
                }
            });

            if (prev1 && [...p1.options].some(o => o.value === prev1)) p1.value = prev1;
            if (prev2 && [...p2.options].some(o => o.value === prev2)) p2.value = prev2;
        }

        function verifyEmp(e) {
            e.preventDefault();
            const inputId = document.getElementById('emp-id-input').value.trim().toUpperCase();
            const inputName = document.getElementById('emp-name-input').value.trim().toUpperCase();
            const msgDiv = document.getElementById('auth-msg');

            const matchedEmp = EMPLOYEE_LIST.find(emp =>
                emp.id.toUpperCase() === inputId && emp.name.toUpperCase() === inputName
            );

            if (matchedEmp) {
                localStorage.setItem('king_newton_auth', 'true');
                localStorage.setItem('king_newton_emp_id', matchedEmp.id);
                localStorage.setItem('king_newton_emp_name', matchedEmp.name);
                msgDiv.innerText = "";
                applyUserSession(matchedEmp.id, matchedEmp.name);
            } else {
                msgDiv.innerText = "❌ 工號與姓名不符，請重新輸入！";
            }
        }

        function logoutSystem() {
            if (confirm("確定要登出系統嗎？")) {
                clearAuthStorage();
                window.location.href = "index.html";
            }
        }

        let pressTimer = null;
        const logoutTrigger = document.getElementById('logout-trigger');
        logoutTrigger.addEventListener('mousedown', () => { pressTimer = setTimeout(logoutSystem, 2000); });
        logoutTrigger.addEventListener('touchstart', () => { pressTimer = setTimeout(logoutSystem, 2000); });
        ['mouseup', 'mouseleave', 'touchend'].forEach(evt => {
            logoutTrigger.addEventListener(evt, () => clearTimeout(pressTimer));
        });

        function initPage() {
            if (window.location.hash === '#reset') {
                clearAuthStorage();
                showLoginModal();
                return;
            }
            try {
                const isAuth = localStorage.getItem('king_newton_auth');
                const empId = (localStorage.getItem('king_newton_emp_id') || '').trim();
                const empName = (localStorage.getItem('king_newton_emp_name') || '').trim();

                if (isAuth === 'true' && empId && empName) {
                    applyUserSession(empId, empName);
                } else {
                    clearAuthStorage();
                    showLoginModal();
                }
            } catch (err) {
                showLoginModal();
            }
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initPage);
        } else {
            initPage();
        }

        function calcDays() {
            const startVal = document.getElementById('startDate').value;
            const endVal = document.getElementById('endDate').value;
            if (!startVal || !endVal) {
                calculatedDays = 0;
                document.getElementById('dayCountText').innerText = "共計：0 天";
                return;
            }
            const start = new Date(startVal);
            const end = new Date(endVal);
            if (end >= start) {
                const diffTime = Math.abs(end - start);
                calculatedDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24)) + 1;
                document.getElementById('dayCountText').innerText = `共計：${calculatedDays} 天`;
                document.getElementById('proxy2').required = (calculatedDays > 3);
            } else {
                calculatedDays = 0;
                document.getElementById('dayCountText').innerText = "結束日期不可早於開始日期";
            }
        }

        function switchTab(tab) {
            document.getElementById('tab-apply').classList.toggle('active', tab === 'apply');
            document.getElementById('tab-review').classList.toggle('active', tab === 'review');
            document.getElementById('sec-apply').classList.toggle('hidden', tab !== 'apply');
            document.getElementById('sec-review').classList.toggle('hidden', tab !== 'review');

            if (tab === 'review') {
                loadTripRecords();
            }
        }

        function submitTrip(e) {
            e.preventDefault();
            if (!currentUser.id || !currentUser.name) {
                showLoginModal();
                return;
            }
            if (calculatedDays <= 0) {
                alert("請確認開始與結束日期是否正確！");
                return;
            }

            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.innerText = "提交中...";

            const empName = currentUser.name;
            const startDate = document.getElementById('startDate').value;
            const endDate = document.getElementById('endDate').value;
            const days = calculatedDays;
            const route = document.getElementById('route').value.trim();
            const reason = document.getElementById('reason').value.trim();

            const payload = {
                action: "createTrip",
                empId: currentUser.id,
                empName: empName,
                factory: document.querySelector('input[name="factory"]:checked').value,
                startDate: startDate,
                endDate: endDate,
                days: days,
                route: route,
                reason: reason,
                transport: document.getElementById('transport').value,
                expense: document.getElementById('expense').value.trim() || "無",
                proxy1: document.getElementById('proxy1').value,
                proxy2: document.getElementById('proxy2').value || "無",
                status: "待一階簽核"
            };

            fetch(GAS_WEB_APP_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            }).then(() => {
                alert("🎉 出差單已成功送出！");

                const waText = encodeURIComponent(
                    `【出差審核通知】\n` +
                    `同仁：${empName}\n` +
                    `地點/行程：${route}\n` +
                    `期間：${startDate} 至 ${endDate}（${days} 天）\n` +
                    `事由：${reason}\n` +
                    `請至金牛頓系統進行一階簽核。`
                );

                const ericPhone = MANAGER_PHONES["ERIC"] || "";
                if (confirm("是否立即開啟 WhatsApp 發送訊息通知一階主管 ERIC？")) {
                    const waUrl = ericPhone
                        ? `https://wa.me/${ericPhone}?text=${waText}`
                        : `https://api.whatsapp.com/send?text=${waText}`;
                    window.open(waUrl, '_blank');
                }

                document.getElementById('tripForm').reset();
                calculatedDays = 0;
                document.getElementById('dayCountText').innerText = "共計：0 天";
                refreshProxyOptions();
                btn.disabled = false;
                btn.innerText = "送出出差申請";
                switchTab('review');
                setTimeout(loadTripRecords, 1500);
            }).catch(err => {
                alert("送出失敗：" + err);
                btn.disabled = false;
                btn.innerText = "送出出差申請";
            });
        }

        function handleReview(empId, applicantName, route, days, startDate, stage, decision) {
            const actionLabel = decision === 'approve' ? '核准' : '駁回';
            const note = prompt(`【第${stage}階簽核】確定要將此出差單設為【${actionLabel}】嗎？請輸入備註：`, decision === 'approve' ? '同意' : '退回修正');
            if (note === null) return;

            let nextStatus = "待一階簽核";
            if (decision === 'reject') {
                nextStatus = "已駁回";
            } else if (stage === 1) {
                nextStatus = "待二階簽核";
            } else if (stage === 2) {
                nextStatus = "已核准";
            }

            const payload = {
                action: "reviewTrip",
                empId: empId,
                startDate: startDate,
                stage: stage,
                decision: decision,
                newStatus: nextStatus,
                reviewerNote: `[${stage}階 ${currentUser.name} - ${actionLabel}] ${note}`
            };

            fetch(GAS_WEB_APP_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            }).then(() => {
                alert(`✅ 第${stage}階簽核完成，目前狀態：${nextStatus}`);

                if (stage === 1 && decision === 'approve') {
                    const targetManager = prompt(
                        "一階簽核成功！請問要透過 WhatsApp 通知哪位二階主管？\n請輸入：1 (李彥綸-台北) 或 2 (楊添仰-台南)",
                        "1"
                    );

                    let nextManagerName = "";
                    if (targetManager === "1") nextManagerName = "李彥綸";
                    else if (targetManager === "2") nextManagerName = "楊添仰";

                    if (nextManagerName) {
                        const waText = encodeURIComponent(
                            `【出差二階簽核通知】\n` +
                            `一階主管 ${currentUser.name} 已核准。\n` +
                            `申請同仁：${applicantName}\n` +
                            `地點/行程：${route} (${days}天)\n` +
                            `請 ${nextManagerName} 主管至系統進行二階最終核准。`
                        );

                        const nextPhone = MANAGER_PHONES[nextManagerName] || "";
                        const waUrl = nextPhone
                            ? `https://wa.me/${nextPhone}?text=${waText}`
                            : `https://api.whatsapp.com/send?text=${waText}`;
                        window.open(waUrl, '_blank');
                    }
                }

                setTimeout(loadTripRecords, 1500);
            });
        }

        function parseCSVRow(line) {
            const result = [];
            let current = '';
            let inQuotes = false;
            for (let i = 0; i < line.length; i++) {
                const ch = line[i];
                if (ch === '"') {
                    if (inQuotes && line[i + 1] === '"') {
                        current += '"';
                        i++;
                    } else {
                        inQuotes = !inQuotes;
                    }
                } else if (ch === ',' && !inQuotes) {
                    result.push(current.trim());
                    current = '';
                } else {
                    current += ch;
                }
            }
            result.push(current.trim());
            return result;
        }

        function loadTripRecords() {
            const listDiv = document.getElementById('recordList');
            listDiv.innerHTML = '<div class="text-center text-slate-400 py-6">資料讀取中...</div>';

            const sep = CSV_DATA_URL.includes('?') ? '&' : '?';
            fetch(`${CSV_DATA_URL}${sep}t=${new Date().getTime()}`)
                .then(res => {
                    if (!res.ok) throw new Error('HTTP ' + res.status);
                    return res.text();
                })
                .then(csvText => {
                    const cleanText = csvText.replace(/\r/g, '').trim();
                    if (!cleanText || cleanText.startsWith('<!DOCTYPE') || cleanText.startsWith('<html')) {
                        listDiv.innerHTML = '<div class="text-center text-slate-400 py-6">尚無任何出差紀錄</div>';
                        return;
                    }

                    const lines = cleanText.split('\n').filter(l => l.trim() !== '');
                    if (lines.length <= 1) {
                        listDiv.innerHTML = '<div class="text-center text-slate-400 py-6">尚無任何出差紀錄</div>';
                        return;
                    }

                    const isLevel1 = LEVEL1_MANAGER_IDS.includes(currentUser.id);
                    const isLevel2 = LEVEL2_MANAGER_IDS.includes(currentUser.id);

                    const parsedRows = lines.slice(1).map(parseCSVRow).filter(r => r.some(c => c !== ''));
                    if (parsedRows.length === 0) {
                        listDiv.innerHTML = '<div class="text-center text-slate-400 py-6">尚無任何出差紀錄</div>';
                        return;
                    }

                    // 動態尋找關鍵欄位索引，避免欄位順序或前置欄位差異造成抓不到資料
                    const findCol = (col, candidates, fallbackIdx) => {
                        for (const idx of candidates) {
                            if (idx >= 0 && idx < col.length && col[idx]) return col[idx];
                        }
                        return fallbackIdx >= 0 && fallbackIdx < col.length ? col[fallbackIdx] : '';
                    };

                    const dataRows = parsedRows.reverse();

                    listDiv.innerHTML = dataRows.map(col => {
                        const empId = findCol(col, [1, 0], 1);
                        const empName = findCol(col, [2, 1], 2);
                        const factory = findCol(col, [3, 2], 3);
                        const startDate = findCol(col, [4, 3], 4);
                        const endDate = findCol(col, [5, 4], 5);
                        const days = findCol(col, [6, 5], 6);
                        const route = findCol(col, [7, 6], 7);
                        const reason = findCol(col, [8, 7], 8);
                        const transport = findCol(col, [9, 8], 9);
                        const expense = findCol(col, [10, 9], 10) || '無';
                        const proxy1 = findCol(col, [11, 10], 11);
                        const proxy2 = findCol(col, [12, 11], 12) || '無';
                        const status = findCol(col, [13, 12], 13) || '待一階簽核';
                        const note = findCol(col, [14, 13], 14);

                        let badgeClass = 'bg-amber-100 text-amber-700';
                        if (status.includes('核准')) badgeClass = 'bg-emerald-100 text-emerald-700';
                        else if (status.includes('駁回')) badgeClass = 'bg-rose-100 text-rose-700';
                        else if (status.includes('二階') || status === '審核中') badgeClass = 'bg-sky-100 text-sky-700';

                        const safeEmpName = empName.replace(/'/g, "\\'");
                        const safeRoute = route.replace(/'/g, "\\'");

                        let actionButtonsHtml = '';
                        if (isLevel1 && (status === '待一階簽核' || status === '審核中')) {
                            actionButtonsHtml = `
                                <div class="flex gap-2 pt-2 border-t">
                                    <button type="button" onclick="handleReview('${empId}', '${safeEmpName}', '${safeRoute}', '${days}', '${startDate}', 1, 'approve')" class="flex-1 bg-[#00a600] text-white py-1.5 rounded-lg font-bold text-xs hover:bg-emerald-700 cursor-pointer">一階核准</button>
                                    <button type="button" onclick="handleReview('${empId}', '${safeEmpName}', '${safeRoute}', '${days}', '${startDate}', 1, 'reject')" class="flex-1 bg-rose-600 text-white py-1.5 rounded-lg font-bold text-xs hover:bg-rose-700 cursor-pointer">一階駁回</button>
                                </div>
                            `;
                        } else if (isLevel2 && (status === '待二階簽核' || status === '審核中')) {
                            actionButtonsHtml = `
                                <div class="flex gap-2 pt-2 border-t">
                                    <button type="button" onclick="handleReview('${empId}', '${safeEmpName}', '${safeRoute}', '${days}', '${startDate}', 2, 'approve')" class="flex-1 bg-blue-600 text-white py-1.5 rounded-lg font-bold text-xs hover:bg-blue-700 cursor-pointer">二階核准</button>
                                    <button type="button" onclick="handleReview('${empId}', '${safeEmpName}', '${safeRoute}', '${days}', '${startDate}', 2, 'reject')" class="flex-1 bg-rose-600 text-white py-1.5 rounded-lg font-bold text-xs hover:bg-rose-700 cursor-pointer">二階駁回</button>
                                </div>
                            `;
                        }

                        return `
                            <div class="border border-slate-200 rounded-xl p-3.5 bg-slate-50 space-y-2 shadow-sm">
                                <div class="flex justify-between items-center border-b pb-1.5">
                                    <span class="font-bold text-slate-800 text-sm">${empName} (${factory}廠)</span>
                                    <span class="px-2.5 py-0.5 rounded-full text-[10px] font-bold ${badgeClass}">${status}</span>
                                </div>
                                <div class="text-slate-600"><strong>期間：</strong>${startDate} ~ ${endDate} (${days}天)</div>
                                <div class="text-slate-600"><strong>行程：</strong>${route} (${transport})</div>
                                <div class="text-slate-600"><strong>事由：</strong>${reason}</div>
                                <div class="text-slate-600"><strong>費用/預支：</strong>${expense}</div>
                                <div class="text-slate-500 text-[11px]"><strong>代理人：</strong>${proxy1} ${proxy2 && proxy2 !== '無' ? '/ ' + proxy2 : ''}</div>
                                ${note ? `<div class="text-slate-600 text-[11px] bg-slate-100 p-1.5 rounded"><strong>簽核備註：</strong>${note}</div>` : ''}
                                ${actionButtonsHtml}
                            </div>
                        `;
                    }).join('');
                })
                .catch(() => {
                    listDiv.innerHTML = '<div class="text-center text-rose-500 py-4">讀取 CSV 資料失敗，請確認 Google Sheet 發布與權限。</div>';
                });
        }
    </script>
</body>
</html>
