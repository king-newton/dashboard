<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>金牛頓公司活動行事曆與出差簽核</title>
    <style>
        /* --- 電腦版樣式：完全保持不動 --- */
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 20px; background-color: #f8f9fa; max-width: 1200px; margin: 0 auto; line-height: 1.6; }
        h2 { color: #0d47a1; border-bottom: 3px solid #e0e0e0; padding-bottom: 5px; margin-top: 5px; margin-bottom: 15px; }

        select, input[type="date"], input[type="text"], input[type="number"], textarea {
            height: 40px; padding: 8px 12px; border: 1px solid #ced4da; border-radius: 4px; box-sizing: border-box; font-size: 14px; vertical-align: middle;
        }
        table { width: 100%; border-collapse: collapse; background-color: white; margin-bottom: 20px; }
        th, td { border: 1px solid #dee2e6; padding: 10px; text-align: center; }
        th { background-color: #e3f2fd; color: #0d47a1; }

        #calendarContainer { margin-top: 30px; border: 1px solid #0d47a1; box-shadow: 0 4px 15px rgba(0,0,0,0.2); border-radius: 8px; overflow: hidden; background: white; }
        #calendarHeader { background-color: #0d47a1; color: white; padding: 15px; font-size: 1.5em; font-weight: bold; display: flex; justify-content: space-between; align-items: center; }
        #calendarHeader button { background: rgba(255,255,255,0.2); border: 1px solid white; color: white; padding: 5px 12px; cursor: pointer; border-radius: 4px; font-size: 0.6em; }

        #calendar td { height: 110px; vertical-align: top; width: 14.28%; }
        #calendar td:nth-child(1), #calendar th:nth-child(1) { color: #d32f2f; }
        #calendar td:nth-child(7), #calendar th:nth-child(7) { color: #1565c0; }

        .hide-sun th:nth-child(1), .hide-sun td:nth-child(1) { display: none !important; }
        .hide-sat th:nth-child(7), .hide-sat td:nth-child(7) { display: none !important; }

        .leave-record { padding: 3px 6px; margin-top: 3px; border-radius: 3px; font-size: 0.85em; text-align: left; border-left: 4px solid #999; background: #eee; word-break: break-all; }
        .trip-record { background-color: #00897b !important; color: white !important; border-left: 4px solid #004d40 !important; }
        .activity-record { background-color: #673ab7 !important; color: white !important; }
        .golden-record { background-color: #0d47a1 !important; color: white !important; }
        .holiday-record { background-color: #e91e63 !important; color: white !important; }

        .suggestion-display-box { background-color: #ffffff; border: 2px solid #ffb74d; border-radius: 8px; padding: 20px; margin-top: 30px; }
        .action-section { background: white; padding: 20px; border: 1px solid #ccc; border-radius: 8px; margin-top: 20px; }

        /* 出差送簽與審核區塊樣式 */
        .trip-workflow-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 16px; margin-top: 12px; }
        .trip-form-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; margin-bottom: 10px; }
        .trip-btn-primary { height: 40px; background: #00897b; color: white; border: none; padding: 0 18px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .trip-btn-primary:hover { background: #00695c; }
        .trip-btn-secondary { height: 34px; background: #0d47a1; color: white; border: none; padding: 0 12px; border-radius: 4px; cursor: pointer; font-size: 13px; }
        .trip-btn-secondary:hover { background: #08306b; }
        .status-badge { display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 12px; background: #e0f2f1; color: #004d40; font-weight: bold; }

        /* --- 手機版專屬修正區 (只在螢幕 600px 以下生效) --- */
        #mobileCards { display: none; padding: 10px; background: #f1f3f4; }

        @media (max-width: 600px) {
            #calendar { display: none !important; }
            #mobileCards { display: block; }

            #currentYearMonth {
                font-size: 0.8em !important;
                white-space: nowrap !important;
                margin: 0 5px;
            }
            #calendarHeader {
                padding: 10px 5px !important;
            }
            #calendarHeader button {
                padding: 5px 8px !important;
            }

            .card { border: 1px solid #ccc; padding: 12px; margin-bottom: 8px; background: white; border-radius: 6px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
            .card-date { font-weight: bold; color: #0d47a1; border-bottom: 2px solid #e3f2fd; margin-bottom: 8px; font-size: 1.1em; display: flex; justify-content: space-between; }
            .card-weekend { color: #d32f2f; }
        }

        @media print { .no-print, .action-section, #calendarHeader button { display: none !important; } }
    </style>
</head>
<body>

    <iframe name="trip_hidden_iframe" id="trip_hidden_iframe" style="display:none;" onload="if(tripSubmitted) { handleTripSubmitSuccess(); }"></iframe>

    <h2>📊 金牛頓公司活動行事曆</h2>

    <div id="calendarContainer">
        <div id="calendarHeader">
            <button type="button" onclick="changeMonth(-1)">◀ 上個月</button>
            <span id="currentYearMonth">2026年 3月</span>
            <button type="button" onclick="changeMonth(1)">下個月 ▶</button>
        </div>
        <table id="calendar">
            <thead>
                <tr>
                    <th>日</th>
                    <th><button type="button" onclick="toggleSun()" style="cursor:pointer; margin-right:5px;">◀</button>一</th>
                    <th>二</th><th>三</th><th>四</th>
                    <th>五<button type="button" onclick="toggleSat()" style="cursor:pointer; margin-left:5px;">▶</button></th>
                    <th>六</th>
                </tr>
            </thead>
            <tbody id="calendarBody"></tbody>
        </table>
        <div id="mobileCards"></div>
    </div>

    <!-- 出差單送簽與 WhatsApp 通知流程區（比照請假單兩階段通知） -->
    <div class="action-section no-print">
        <h3 style="margin-top:0; color:#00695c;">🧳 出差單申請與送簽 WhatsApp 通知</h3>
        <div class="trip-workflow-grid">
            <!-- 1. 填寫並送出出差單 -->
            <div style="background:#f8fffe; border:1px solid #b2dfdb; border-radius:6px; padding:15px;">
                <h4 style="margin:0 0 10px 0; color:#004d40;">① 填寫出差申請（送出後通知一階主管 ERIC）</h4>
                <form id="businessTripForm" action="https://script.google.com/macros/s/AKfycbxTS3PsYZxik44YUGnLxtfS9UsdlK-6P_EHrcHjONLoEqsD2sENhXyvQLGaEGzMfZAxZQ/exec" method="POST" target="trip_hidden_iframe" onsubmit="prepareTripSubmit()">
                    <input type="hidden" name="action" value="submitBusinessTrip">
                    <div class="trip-form-row">
                        <div>
                            <label style="font-size:12px; font-weight:bold; display:block;">出差人員</label>
                            <select id="tripEmpName" name="empName" required style="width:100%;"></select>
                        </div>
                        <div>
                            <label style="font-size:12px; font-weight:bold; display:block;">出差天數</label>
                            <input type="number" id="tripDays" name="days" step="0.5" min="0.5" value="1" required style="width:100%;">
                        </div>
                    </div>
                    <div class="trip-form-row">
                        <div>
                            <label style="font-size:12px; font-weight:bold; display:block;">開始日期</label>
                            <input type="date" id="tripStartDate" name="startDate" onchange="syncTripEndDate()" required style="width:100%;">
                        </div>
                        <div>
                            <label style="font-size:12px; font-weight:bold; display:block;">結束日期</label>
                            <input type="date" id="tripEndDate" name="endDate" onchange="recalcTripDays()" required style="width:100%;">
                        </div>
                    </div>
                    <div class="trip-form-row">
                        <div>
                            <label style="font-size:12px; font-weight:bold; display:block;">出差地點 / 路線</label>
                            <input type="text" id="tripRoute" name="route" placeholder="例：台中客戶現場" required style="width:100%;">
                        </div>
                        <div>
                            <label style="font-size:12px; font-weight:bold; display:block;">出差事由</label>
                            <input type="text" id="tripReason" name="reason" placeholder="例：機台巡檢與改機評估" required style="width:100%;">
                        </div>
                    </div>
                    <div style="display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; margin-top:8px;">
                        <span style="font-size:12px; color:#546e7a;">送出後可一鍵開啟 WhatsApp 通知一階主管 ERIC</span>
                        <button type="submit" id="tripSubmitBtn" class="trip-btn-primary">🚀 送出出差單並通知一階</button>
                    </div>
                </form>
            </div>

            <!-- 2. 主管簽核與二階 WhatsApp 通知 -->
            <div style="background:#f8fafc; border:1px solid #cbd5e1; border-radius:6px; padding:15px;">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
                    <h4 style="margin:0; color:#0d47a1;">② 出差簽核清單（一階核准後通知二階主管）</h4>
                    <button type="button" onclick="loadPendingTrips()" class="trip-btn-secondary">🔄 重整清單</button>
                </div>
                <div class="trip-form-row">
                    <div>
                        <label style="font-size:12px; font-weight:bold; display:block;">簽核層級</label>
                        <select id="tripManagerStep" onchange="updateTripManagerOptions()" style="width:100%;">
                            <option value="1">第一層主管 (一階審核)</option>
                            <option value="2">第二層主管 (二階最終核准)</option>
                        </select>
                    </div>
                    <div>
                        <label style="font-size:12px; font-weight:bold; display:block;">簽核主管</label>
                        <select id="tripManagerSelect" style="width:100%;"></select>
                    </div>
                </div>
                <div style="overflow-x:auto; max-height:240px; overflow-y:auto;">
                    <table style="margin-bottom:0; font-size:12px;">
                        <thead>
                            <tr>
                                <th>單號</th>
                                <th>人員</th>
                                <th>地點/天數</th>
                                <th>狀態</th>
                                <th>簽核與通知</th>
                            </tr>
                        </thead>
                        <tbody id="tripPendingBody">
                            <tr><td colspan="5" style="color:#78909c;">點擊「重整清單」載入待簽核出差單，或直接測試通知流程</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <div class="suggestion-display-box">
        <h3 style="margin-top:0; color: #e65100;">📋 公司活動建議內容</h3>
        <table id="suggestionTable">
            <thead><tr><th style="width:25%">項目</th><th style="width:75%">建議詳情</th></tr></thead>
            <tbody id="suggestionList"></tbody>
        </table>
    </div>

    <div class="action-section">
        <h3 style="margin-top:0;">🔍 紀錄查詢、備份與列印</h3>
        <div style="display:flex; align-items:center; gap:10px; flex-wrap:wrap;">
            <select id="queryNameSelect" style="min-width:150px; height:40px;"></select>
            <input type="date" id="queryStartDate"> 至 <input type="date" id="queryEndDate">
            <button type="button" onclick="queryRecords()" style="height:40px; background:#007bff; color:white; border:none; padding:0 20px; border-radius:4px; cursor:pointer;">查詢</button>
            <button type="button" onclick="exportToExcel()" style="height:40px; background:#ef6c00; color:white; border:none; padding:0 15px; border-radius:4px; cursor:pointer;">📊 查詢匯出</button>
            <button type="button" onclick="saveFullHTML()" style="height:40px; background:#2e7d32; color:white; border:none; padding:0 15px; border-radius:4px; cursor:pointer;">💾 儲存</button>
            <button type="button" onclick="window.print()" style="height:40px; background:#607d8b; color:white; border:none; padding:0 15px; border-radius:4px; cursor:pointer;">🖨️ 列印</button>
            <button type="button" onclick="toggleAllWeekend()" style="height:40px; background:#455a64; color:white; border:none; padding:0 15px; border-radius:4px; cursor:pointer;">🗓️ 顯示/隱藏週末</button>
        </div>
    </div>

    <div id="queryResultArea"></div>

    <script>
        const holidayList = [
            { date: "2026-01-01", name: "元旦" },
            { date: "2026-02-14", name: "春節" }, { date: "2026-02-15", name: "春節" }, { date: "2026-02-16", name: "春節" },
            { date: "2026-02-17", name: "春節" }, { date: "2026-02-18", name: "春節" }, { date: "2026-02-19", name: "春節" },
            { date: "2026-02-20", name: "春節" }, { date: "2026-02-21", name: "春節" }, { date: "2026-02-22", name: "春節" },
            { date: "2026-02-27", name: "和平紀念日" }, { date: "2026-02-28", name: "和平紀念日" }, { date: "2026-03-01", name: "和平紀念日" },
            { date: "2026-04-03", name: "清明節" }, { date: "2026-04-04", name: "清明節" }, { date: "2026-04-05", name: "清明節" }, { date: "2026-04-06", name: "清明節" },
            { date: "2026-05-01", name: "勞動節" }, { date: "2026-05-02", name: "勞動節" }, { date: "2026-05-03", name: "勞動節" },
            { date: "2026-06-19", name: "端午節" }, { date: "2026-06-20", name: "端午節" }, { date: "2026-06-21", name: "端午節" },
            { date: "2026-09-25", name: "中秋/教師節" }, { date: "2026-09-26", name: "中秋/教師節" }, { date: "2026-09-27", name: "中秋/教師節" }, { date: "2026-09-28", name: "中秋/教師節" },
            { date: "2026-10-09", name: "國慶日" }, { date: "2026-10-10", name: "國慶日" }, { date: "2026-10-11", name: "國慶日" },
            { date: "2026-10-24", name: "光復節" }, { date: "2026-10-25", name: "光復節" }, { date: "2026-10-26", name: "光復節" },
            { date: "2026-12-25", name: "行憲紀念日" }, { date: "2026-12-26", name: "行憲紀念日" }, { date: "2026-12-27", name: "行憲紀念日" }
        ];

        let currentDisplayDate = new Date();
        const SUGGEST_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSk18e6JMlqZrTZkMdMybrvXSX-HuZ5vLTawqbU116-Xwd9DHUf25hAjOO7HxQ6mJ6E6K0ll8Eu-Iy8/pub?gid=1793548004&single=true&output=csv';
        const GOOGLE_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSk18e6JMlqZrTZkMdMybrvXSX-HuZ5vLTawqbU116-Xwd9DHUf25hAjOO7HxQ6mJ6E6K0ll8Eu-Iy8/pub?gid=0&single=true&output=csv';

        // 請假系統 GAS API 網址
        const NEW_GAS_API_URL = 'https://script.google.com/macros/s/AKfycby5eWga0igixQ-bkyFwx1f1-t455YhWClHs7NKOL4YUkyD-bZjdQE8YYwT5eafa3ELY-w/exec';

        // 出差系統 GAS API 網址
        const TRIP_GAS_API_URL = 'https://script.google.com/macros/s/AKfycbxTS3PsYZxik44YUGnLxtfS9UsdlK-6P_EHrcHjONLoEqsD2sENhXyvQLGaEGzMfZAxZQ/exec';

        // WhatsApp 主管電話設定（可填入國碼+號碼，例如 "886912345678"；留空則開啟一般分享連結）
        const TRIP_MANAGER_PHONES = {
            "ERIC": "",
            "李彥綸": "",
            "楊添仰": ""
        };

        const CUT_OFF_DATE = new Date('2026-11-06T00:00:00');

        const nameList = ["全部人員", "金牛頓", "ERIC", "何成偉", "方順黌", "王冠峯", "余品橋", "李佩娟", "高欣宜", "陳秀燕", "陳品鈞", "陳靖昂", "陳慧真", "曾晨杰", "楊添仰", "詹淑敏", "戴政宏", "蘇威丞"];

        let leaveRecords = [];
        let suggestions = [];
        let tripSubmitted = false;
        let lastSubmittedTripSnapshot = null;

        function normalizeDateStr(val) {
            if (!val) return '';
            const str = String(val).trim().split('T')[0].replace(/\//g, '-');
            const parts = str.split('-');
            if (parts.length === 3 && parts[0].length === 4) {
                return `${parts[0]}-${parts[1].padStart(2, '0')}-${parts[2].padStart(2, '0')}`;
            }
            const dt = new Date(val);
            if (!isNaN(dt.getTime())) {
                return `${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, '0')}-${String(dt.getDate()).padStart(2, '0')}`;
            }
            return str;
        }

        function isApprovedStatus(statusVal) {
            const st = String(statusVal || '').trim();
            return st === '已核准' || (st.includes('核准') && !st.includes('待') && !st.includes('未') && !st.includes('駁回'));
        }

        function getNextWorkday(date = new Date()) {
            const next = new Date(date);
            next.setDate(next.getDate() + 1);
            while (next.getDay() === 0 || next.getDay() === 6) {
                next.setDate(next.getDate() + 1);
            }
            return `${next.getFullYear()}-${String(next.getMonth() + 1).padStart(2, '0')}-${String(next.getDate()).padStart(2, '0')}`;
        }

        function syncTripEndDate() {
            const s = document.getElementById('tripStartDate').value;
            const e = document.getElementById('tripEndDate').value;
            if (s && (!e || e < s)) {
                document.getElementById('tripEndDate').value = s;
            }
            recalcTripDays();
        }

        function recalcTripDays() {
            const s = document.getElementById('tripStartDate').value;
            const e = document.getElementById('tripEndDate').value;
            if (!s || !e) return;
            const d1 = new Date(s + 'T00:00:00');
            const d2 = new Date(e + 'T00:00:00');
            if (d2 >= d1) {
                const diff = Math.floor((d2 - d1) / (1000 * 60 * 60 * 24)) + 1;
                document.getElementById('tripDays').value = diff;
            }
        }

        function openWhatsAppNotify(targetName, messageText) {
            const encodedText = encodeURIComponent(messageText);
            const phone = TRIP_MANAGER_PHONES[targetName] || "";
            const waUrl = phone
                ? `https://wa.me/${phone}?text=${encodedText}`
                : `https://api.whatsapp.com/send?text=${encodedText}`;
            window.open(waUrl, '_blank');
        }

        function prepareTripSubmit() {
            tripSubmitted = true;
            lastSubmittedTripSnapshot = {
                empName: document.getElementById('tripEmpName').value,
                startDate: document.getElementById('tripStartDate').value,
                endDate: document.getElementById('tripEndDate').value,
                days: document.getElementById('tripDays').value,
                route: document.getElementById('tripRoute').value,
                reason: document.getElementById('tripReason').value
            };
            const btn = document.getElementById('tripSubmitBtn');
            btn.innerText = "傳送中...";
            btn.disabled = true;
        }

        function handleTripSubmitSuccess() {
            const snap = lastSubmittedTripSnapshot || {};
            alert("🎉 出差單已成功送出！");

            const waText =
                `【出差審核通知】
` +
                `同仁：${snap.empName || ''}
` +
                `地點/行程：${snap.route || ''}
` +
                `期間：${snap.startDate || ''} 至 ${snap.endDate || ''}（${snap.days || 1} 天）
` +
                `事由：${snap.reason || ''}
` +
                `請至金牛頓系統進行一階簽核。`;

            if (confirm("是否立即開啟 WhatsApp 發送訊息通知一階主管 ERIC？")) {
                openWhatsAppNotify("ERIC", waText);
            }

            document.getElementById('businessTripForm').reset();
            const loggedInName = localStorage.getItem('king_newton_emp_name');
            if (loggedInName && nameList.includes(loggedInName) && loggedInName !== "全部人員") {
                document.getElementById('tripEmpName').value = loggedInName;
            }
            const defaultWorkday = getNextWorkday(new Date());
            document.getElementById('tripStartDate').value = defaultWorkday;
            document.getElementById('tripEndDate').value = defaultWorkday;
            document.getElementById('tripDays').value = 1;

            const btn = document.getElementById('tripSubmitBtn');
            btn.innerText = "🚀 送出出差單並通知一階";
            btn.disabled = false;
            tripSubmitted = false;
            lastSubmittedTripSnapshot = null;

            loadPendingTrips();
        }

        function updateTripManagerOptions() {
            const step = document.getElementById('tripManagerStep').value;
            const sel = document.getElementById('tripManagerSelect');
            sel.innerHTML = '';
            if (step === '1') {
                sel.add(new Option("ERIC (一階主管 / 管理員)", "ERIC"));
            } else {
                sel.add(new Option("李彥綸 (二階主管)", "李彥綸"));
                sel.add(new Option("楊添仰 (南區二階主管)", "楊添仰"));
            }
        }

        async function loadPendingTrips() {
            const tbody = document.getElementById('tripPendingBody');
            tbody.innerHTML = `<tr><td colspan="5" style="color:#78909c;">正在載入出差單清單...</td></tr>`;
            try {
                const res = await fetch(`${TRIP_GAS_API_URL}?action=getBusinessTrips&t=${new Date().getTime()}`);
                const json = await res.json();
                const list = Array.isArray(json.data) ? json.data : [];
                const pending = list.filter(row => !isApprovedStatus(row.status));

                if (pending.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="5" style="color:#78909c;">目前無待簽核出差單</td></tr>`;
                    return;
                }

                tbody.innerHTML = pending.map(item => {
                    const id = String(item.id || '');
                    const empName = String(item.empName || item.name || '');
                    const route = String(item.route || item.reason || '');
                    const days = item.days || 1;
                    const status = String(item.status || '待一階簽核');
                    const safeId = encodeURIComponent(id);
                    const safeEmp = encodeURIComponent(empName);
                    const safeRoute = encodeURIComponent(route);
                    const safeDays = encodeURIComponent(String(days));

                    return `
                        <tr>
                            <td style="font-family:monospace;">${id}</td>
                            <td style="font-weight:bold;">${empName}</td>
                            <td style="text-align:left;">${route} (${days}天)</td>
                            <td><span class="status-badge">${status}</span></td>
                            <td>
                                <button type="button" class="trip-btn-secondary" onclick="approveTripItem(decodeURIComponent('${safeId}'), decodeURIComponent('${safeEmp}'), decodeURIComponent('${safeRoute}'), decodeURIComponent('${safeDays}'))">
                                    ✍️ 核准並通知
                                </button>
                            </td>
                        </tr>
                    `;
                }).join('');
            } catch (err) {
                console.error("載入待簽核出差單失敗", err);
                tbody.innerHTML = `<tr><td colspan="5" style="color:#c62828;">無法讀取待簽核清單，請稍後再試</td></tr>`;
            }
        }

        async function approveTripItem(tripId, applicantName, routeOrLoc, days) {
            const loggedInName = localStorage.getItem('king_newton_emp_name') || 'ERIC';
            const step = parseInt(document.getElementById('tripManagerStep').value, 10);
            const managerName = document.getElementById('tripManagerSelect').value;

            if (loggedInName !== 'ERIC' && loggedInName !== managerName) {
                alert(`權限錯誤：您的登入身分是【${loggedInName}】，不可使用【${managerName}】進行簽核！`);
                return;
            }
            if (applicantName === loggedInName && loggedInName !== 'ERIC') {
                alert("防呆機制觸發：申請人不能自行簽核自己的出差單！");
                return;
            }
            if (!confirm(`確定要以【第 ${step} 層主管：${managerName}】核准出差單 ${tripId} 嗎？`)) return;

            try {
                const res = await fetch(TRIP_GAS_API_URL, {
                    method: 'POST',
                    body: JSON.stringify({
                        action: 'approveBusinessTrip',
                        tripId: tripId,
                        step: step,
                        managerName: managerName
                    })
                });
                const json = await res.json();
                alert(`✅ 簽核完成！${json.message || ''}`);

                if (step === 1) {
                    const choice = prompt(
                        "一階簽核成功！請問要透過 WhatsApp 通知哪位二階主管？
請輸入：1 (李彥綸) 或 2 (楊添仰)",
                        "1"
                    );
                    let nextManager = "";
                    if (choice === "1") nextManager = "李彥綸";
                    else if (choice === "2") nextManager = "楊添仰";

                    if (nextManager) {
                        const waText =
                            `【出差二階簽核通知】
` +
                            `一階主管 ${managerName} 已核准。
` +
                            `申請同仁：${applicantName}
` +
                            `地點/行程：${routeOrLoc}（${days} 天）
` +
                            `單號：${tripId}
` +
                            `請 ${nextManager} 主管至系統進行二階最終核准。`;
                        openWhatsAppNotify(nextManager, waText);
                    }
                }

                await fetchData();
                await loadPendingTrips();
            } catch (err) {
                console.error("出差簽核失敗", err);
                alert("簽核送出時發生錯誤，請稍後再試。");
            }
        }

        async function fetchData() {
            try {
                // 1. 抓取 2026/11/05 以前的舊請假資料
                const resL = await fetch(GOOGLE_CSV_URL);
                const dataL = await resL.text();
                const rowsL = dataL.split('
').slice(1);
                let oldRecords = rowsL.filter(r => r.trim() !== '').map((row, index) => {
                    const cols = row.split(',');
                    let durStr = cols[4] || "整天";
                    let rate = 1;
                    if (durStr.includes("半天")) rate = 0.5;
                    else if (durStr.includes("小時")) rate = parseFloat(durStr) / 8;
                    return {
                        id: 'old_' + index,
                        name: (cols[0] || '').trim(),
                        type: (cols[1] || '請假').trim(),
                        start: normalizeDateStr(cols[2]),
                        end: normalizeDateStr(cols[3]) || normalizeDateStr(cols[2]),
                        displayDuration: durStr,
                        rate: rate,
                        note: (cols[5] || '').trim()
                    };
                }).filter(r => r.start);

                oldRecords = oldRecords.filter(r => new Date(r.start + 'T00:00:00') < CUT_OFF_DATE);

                // 2. 抓取 2026/11/06 起的新請假紀錄 (已核准)
                let newRecords = [];
                try {
                    const resNew = await fetch(`${NEW_GAS_API_URL}?action=getAllLeavesForCalendar&t=${new Date().getTime()}`);
                    const jsonNew = await resNew.json();
                    if (jsonNew.status === 'success' && Array.isArray(jsonNew.data)) {
                        newRecords = jsonNew.data
                            .filter(row => {
                                const startStr = normalizeDateStr(row.startTime);
                                if (!startStr) return false;
                                const leaveStart = new Date(startStr + 'T00:00:00');
                                const isApproved = isApprovedStatus(row.status) || isApprovedStatus(row.step2Status);
                                return leaveStart >= CUT_OFF_DATE && isApproved;
                            })
                            .map(row => {
                                const startDate = normalizeDateStr(row.startTime);
                                const endDate = normalizeDateStr(row.endTime) || startDate;
                                return {
                                    id: row.id,
                                    name: String(row.name || '').trim(),
                                    type: String(row.type || '請假').trim(),
                                    start: startDate,
                                    end: endDate,
                                    displayDuration: (row.days || 1) + "天",
                                    rate: 1,
                                    note: String(row.reason || '').trim()
                                };
                            });
                    }
                } catch (err) {
                    console.error("載入新請假系統資料失敗", err);
                }

                // 3. 抓取【出差單】紀錄 (僅抓取：已核准)
                let tripRecords = [];
                try {
                    const resTrip = await fetch(`${TRIP_GAS_API_URL}?action=getBusinessTrips&t=${new Date().getTime()}`);
                    const jsonTrip = await resTrip.json();
                    if (jsonTrip.status === 'success' && Array.isArray(jsonTrip.data)) {
                        tripRecords = jsonTrip.data
                            .filter(row => isApprovedStatus(row.status))
                            .map(row => {
                                const startDate = normalizeDateStr(row.startDate || row.startTime || '');
                                const endDate = normalizeDateStr(row.endDate || row.endTime || '') || startDate;
                                const location = String(row.route || row.reason || '').trim();
                                return {
                                    id: row.id || ('trip_' + Math.random()),
                                    name: String(row.empName || row.name || '').trim(),
                                    type: '出差',
                                    start: startDate,
                                    end: endDate,
                                    displayDuration: (row.days || 1) + "天",
                                    rate: 1,
                                    note: `出差: ${location}`
                                };
                            })
                            .filter(r => r.start && r.end);
                    }
                } catch (err) {
                    console.error("載入出差單紀錄失敗", err);
                }

                // 4. 合併舊請假、新請假、出差紀錄
                leaveRecords = [...oldRecords, ...newRecords, ...tripRecords];

                // 5. 抓取建議事項
                const resS = await fetch(SUGGEST_CSV_URL);
                const dataS = await resS.text();
                const rowsS = dataS.split('
').slice(1);
                suggestions = rowsS.filter(r => r.trim() !== '').map(row => {
                    const cols = row.split(',');
                    return { title: cols[0], content: cols[1] };
                });

                renderCalendar(currentDisplayDate.getFullYear(), currentDisplayDate.getMonth() + 1);
                renderSuggestions();
            } catch (e) {
                console.error("資料讀取失敗", e);
            }
        }

        function toggleSun() { document.getElementById('calendarContainer').classList.toggle('hide-sun'); }
        function toggleSat() { document.getElementById('calendarContainer').classList.toggle('hide-sat'); }

        function toggleAllWeekend() {
            const el = document.getElementById('calendarContainer');
            if (el.classList.contains('hide-sun') || el.classList.contains('hide-sat')) {
                el.classList.remove('hide-sun', 'hide-sat');
            } else {
                el.classList.add('hide-sun', 'hide-sat');
            }
        }

        function calculateDays(r) {
            const d1 = new Date(r.start + 'T00:00:00');
            const d2 = new Date(r.end + 'T00:00:00');
            const diffDays = Math.ceil(Math.abs(d2 - d1) / (1000 * 60 * 60 * 24)) + 1;
            return diffDays * r.rate;
        }

        function queryRecords() {
            const qName = document.getElementById('queryNameSelect').value, s = document.getElementById('queryStartDate').value, e = document.getElementById('queryEndDate').value;
            if (!s || !e) return alert("請選日期範圍後再執行查詢");
            let res = leaveRecords.filter(r => ((r.start >= s && r.start <= e) || (r.end >= s && r.end <= e) || (r.start <= s && r.end >= e)) && (qName === "全部人員" || r.name === qName));
            res.sort((a, b) => a.start < b.start ? -1 : 1);
            let stats = {};
            let h = `<table><thead><tr><th>姓名</th><th>類別/事由</th><th>開始日期</th><th>結束日期</th><th>時數/天數</th><th>說明/地點</th></tr></thead><tbody>`;
            res.forEach(r => {
                const totalDays = calculateDays(r);
                stats[r.type] = (stats[r.type] || 0) + totalDays;
                h += `<tr><td>${r.name}</td><td>${r.type}</td><td>${r.start}</td><td>${r.end}</td><td style="color:red; font-weight:bold;">${totalDays}天</td><td style="text-align:left;">${r.note}</td></tr>`;
            });
            if (res.length > 0) {
                let stText = Object.keys(stats).map(k => `${k}: ${stats[k]}天`).join(' | ');
                h += `<tr style="background:#fff9c4; font-weight:bold;"><td colspan="3">統計摘要</td><td colspan="3">${stText}</td></tr>`;
            } else { h += `<tr><td colspan="6">此範圍內查無資料</td></tr>`; }
            document.getElementById('queryResultArea').innerHTML = h + '</tbody></table>';
        }

        function exportToExcel() {
            const qName = document.getElementById('queryNameSelect').value, s = document.getElementById('queryStartDate').value, e = document.getElementById('queryEndDate').value;
            if (!s || !e) return alert("請先選取日期範圍並執行查詢後再匯出");
            let res = leaveRecords.filter(r => ((r.start >= s && r.start <= e) || (r.end >= s && r.end <= e) || (r.start <= s && r.end >= e)) && (qName === "全部人員" || r.name === qName));
            if (res.length === 0) return alert("目前查詢範圍內無資料可匯出");
            let csvContent = "﻿姓名,類別,開始日期,結束日期,時數/天數,說明/地點
";
            res.forEach(r => {
                csvContent += `${r.name},${r.type},${r.start},${r.end},${calculateDays(r)}天,${String(r.note || '').replace(/,/g, "，")}
`;
            });
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = `金牛頓查詢紀錄_${s}_至_${e}.csv`;
            link.click();
        }

        function renderCalendar(year, month) {
            const tbody = document.getElementById('calendarBody');
            const mobileCardsEl = document.getElementById('mobileCards');
            document.getElementById('currentYearMonth').textContent = `${year}年 ${month}月`;
            const today = new Date();
            const todayStr = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`;

            let html = '';
            let cardsHtml = '';

            const firstDay = new Date(year, month - 1, 1).getDay();
            const lastDate = new Date(year, month, 0).getDate();
            const weekDays = ['日','一','二','三','四','五','六'];
            let date = 1;

            for (let i = 0; i < 6; i++) {
                let row = '<tr>';
                for (let j = 0; j < 7; j++) {
                    if ((i === 0 && j < firstDay) || date > lastDate) {
                        row += '<td style="background:#f9f9f9;"></td>';
                    } else {
                        const ds = `${year}-${String(month).padStart(2,'0')}-${String(date).padStart(2,'0')}`;
                        const isToday = (ds === todayStr);
                        const records = leaveRecords.filter(r => ds >= r.start && ds <= r.end);
                        const dayHolidays = holidayList.filter(h => h.date === ds);
                        const allRecords = [...records, ...dayHolidays.map(h => ({ name: "國定假日", note: h.name, type: '假期' }))];

                        row += `<td style="${isToday ? 'background-color: #fff9c4;' : ''}">
                            <div style="font-weight:bold;text-align:center;">${date}</div>
                            ${allRecords.map(r => {
                                let tc = (r.name === '金牛頓') ? 'golden-record' : (r.type === '出差' ? 'trip-record' : (r.type === '活動' ? 'activity-record' : (r.type === '假期' ? 'holiday-record' : 'leave-record')));
                                return `<div class="leave-record ${tc}">${r.name}-${r.note}</div>`;
                            }).join('')}
                        </td>`;

                        cardsHtml += `<div class="card">
                            <div class="card-date">
                                <span>${month}月${date}日</span>
                                <span class="${(j===0||j===6)?'card-weekend':''}">(週${weekDays[j]})</span>
                            </div>
                            ${allRecords.length > 0 ? allRecords.map(r => {
                                let tc = (r.name === '金牛頓') ? 'golden-record' : (r.type === '出差' ? 'trip-record' : (r.type === '活動' ? 'activity-record' : (r.type === '假期' ? 'holiday-record' : 'leave-record')));
                                return `<div class="leave-record ${tc}">${r.name}-${r.note}</div>`;
                            }).join('') : '<div style="color:#ccc; font-size:0.8em;">暫無活動</div>'}
                        </div>`;
                        date++;
                    }
                }
                html += row + '</tr>';
                if (date > lastDate) break;
            }
            tbody.innerHTML = html;
            mobileCardsEl.innerHTML = cardsHtml;
        }

        function renderSuggestions() {
            document.getElementById('suggestionList').innerHTML = suggestions.map(s => {
                return `<tr><td style="font-weight:bold;">${s.title}</td><td style="text-align:left; white-space:pre-wrap;">${s.content}</td></tr>`;
            }).join('');
        }

        function changeMonth(d) { currentDisplayDate.setMonth(currentDisplayDate.getMonth() + d); renderCalendar(currentDisplayDate.getFullYear(), currentDisplayDate.getMonth() + 1); }

        function saveFullHTML() {
            const queryArea = document.getElementById('queryResultArea');
            const originalContent = queryArea.innerHTML;
            queryArea.innerHTML = "";
            const blob = new Blob(['<!DOCTYPE html>
' + document.documentElement.outerHTML], { type: 'text/html' });
            const a = document.createElement("a");
            a.href = URL.createObjectURL(blob);
            a.download = `金牛頓行事曆_${new Date().toISOString().split('T')[0]}.html`;
            a.click();
            queryArea.innerHTML = originalContent;
        }

        document.addEventListener('DOMContentLoaded', () => {
            const qSel = document.getElementById('queryNameSelect');
            const empSel = document.getElementById('tripEmpName');
            nameList.forEach(n => {
                qSel.add(new Option(n, n));
                if (n !== "全部人員") {
                    empSel.add(new Option(n, n));
                }
            });

            const loggedInName = localStorage.getItem('king_newton_emp_name');
            if (loggedInName && nameList.includes(loggedInName) && loggedInName !== "全部人員") {
                empSel.value = loggedInName;
            }

            const defaultWorkday = getNextWorkday(new Date());
            document.getElementById('tripStartDate').value = defaultWorkday;
            document.getElementById('tripEndDate').value = defaultWorkday;
            updateTripManagerOptions();
            fetchData();
        });
    </script>
