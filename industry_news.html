        let combinedNews = [];

        async function fetchIndustryNews() {
            try {
                // 🌟 加入時間戳記參數（&t=...），強制每天、每次重新整理時向 Google 請求最新 RSS，不使用舊快取
                const cacheBuster = new Date().getTime();
                const searchQuery = encodeURIComponent('射出成型機 OR 富強鑫 OR 全立發 OR 華嶸 OR 樺欽 OR 銷售噸數 OR 出口數據 OR 油壓機改裝');
                const rssUrl = `https://news.google.com/rss/search?q=${searchQuery}&hl=zh-TW&gl=TW&ceid=TW:zh-Hant`;
                const apiUrl = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(rssUrl)}&t=${cacheBuster}`;

                const response = await fetch(apiUrl);
                const data = await response.json();

                let rssItems = [];
                if (data.status === 'ok' && data.items.length > 0) {
                    rssItems = data.items.map(item => {
                        let matchedTag = "產業新聞";
                        let cat = "others";
                        
                        if (item.title.includes("噸") || item.title.includes("出口") || item.title.includes("銷售")) {
                            matchedTag = "📈 數據統計"; cat = "數據統計";
                        } else if (item.title.includes("改裝") || item.title.includes("改造") || item.description.includes("舊機")) {
                            matchedTag = "🛠️ 舊機改造"; cat = "舊機改造";
                        } else if (item.title.includes("AI") || item.title.includes("智慧")) {
                            matchedTag = "🤖 AI智慧"; cat = "AI智慧";
                        } else if (item.title.includes("富強鑫")) { matchedTag = "富強鑫"; cat = "富強鑫"; }
                        else if (item.title.includes("全立發")) { matchedTag = "全立發"; cat = "全立發"; }
                        else if (item.title.includes("華嶸")) { matchedTag = "華嶸"; cat = "華嶸"; }
                        else if (item.title.includes("樺欽")) { matchedTag = "樺欽"; cat = "樺欽"; }

                        return {
                            tag: matchedTag,
                            category: cat,
                            title: item.title,
                            date: new Date(item.pubDate).toLocaleDateString('zh-TW'),
                            desc: item.description.replace(/<[^>]*>?/gm, ''),
                            source: `資料來源：Google 新聞即時聯播網 (${item.author || '各大財經與產業媒體'})`,
                            link: item.link,
                            isRss: true
                        };
                    });
                }

                // 全量資料庫 + RSS 即時新聞合併，依日期降序（最新在上）排序
                combinedNews = [...masterKnowledgeDatabase, ...rssItems].sort((a, b) => new Date(b.date) - new Date(a.date));
                renderNewsCards(combinedNews);

            } catch (err) {
                console.error("即時新聞連線受阻，載入全量資料庫：", err);
                combinedNews = masterKnowledgeDatabase.sort((a, b) => new Date(b.date) - new Date(a.date));
                renderNewsCards(combinedNews);
            }
        }

                grid.innerHTML = `
                    <div class="col-span-1 md:col-span-2 text-center py-12 text-slate-400 font-bold bg-white rounded-2xl border border-slate-200">
                        <i class="fa-solid fa-circle-exclamation text-2xl text-amber-500 mb-2"></i>
                        <p>目前沒有找到相關主題的數據與實戰案例。</p>
                    </div>
                `;
                return;
            }

            grid.innerHTML = items.map(item => `
                <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 flex flex-col justify-between hover:shadow-md transition">
                    <div>
                        <div class="flex justify-between items-center mb-2">
                            <span class="bg-emerald-100 text-emerald-800 text-[10px] font-bold px-2.5 py-1 rounded-full">${item.tag}</span>
                            <span class="text-xs text-slate-400"><i class="fa-regular fa-clock mr-1"></i>${item.date}</span>
                        </div>
                        <h3 class="font-bold text-slate-800 text-base leading-snug mb-2 hover:text-emerald-600 transition">
                            ${item.link !== '#' ? `<a href="${item.link}" target="_blank" class="text-slate-800 hover:text-emerald-600 text-decoration-none">${item.title}</a>` : item.title}
                        </h3>
                        <p class="text-xs text-slate-600 line-clamp-4 leading-relaxed">${item.desc}</p>
                    </div>
                    
                    <div class="mt-4 pt-3 border-t border-slate-100 space-y-2">
                        <!-- 🌟 明確標示出處來源，讓數據與資訊透明化 -->
                        <div class="text-[11px] text-slate-400 font-medium flex items-center gap-1">
                            <i class="fa-solid fa-bookmark text-emerald-600 text-[10px]"></i>
                            <span>${item.source || '資料來源：產業實務研究與技術文獻'}</span>
                        </div>
                        
                        <div class="flex justify-between items-center text-xs">
                            <span class="text-slate-400 font-semibold">${item.isRss ? 'Google 即時產業報導' : '實戰數據與指標解密'}</span>
                            ${item.link !== '#' ? `
                                <a href="${item.link}" target="_blank" class="text-emerald-600 font-bold hover:underline flex items-center gap-1">
                                    閱讀詳情 <i class="fa-solid fa-arrow-up-right-from-square text-[10px]"></i>
                                </a>
                            ` : `
                                <span class="text-emerald-700 font-bold"><i class="fa-solid fa-chart-pie mr-0.5"></i> 核心實務數據</span>
                            `}
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function filterNews(keyword, btnElement) {
            const buttons = document.querySelectorAll('.nav-btn');
            buttons.forEach(btn => {
                btn.className = "nav-btn bg-white text-slate-700 font-bold px-4 py-2 rounded-xl text-xs border border-slate-200 hover:bg-emerald-50 transition";
            });
            btnElement.className = "nav-btn bg-emerald-600 text-white font-bold px-4 py-2 rounded-xl text-xs shadow-sm transition";

            if (keyword === 'all') {
                renderNewsCards(combinedNews);
            } else {
                const filtered = combinedNews.filter(item => 
                    item.category === keyword || item.tag.includes(keyword) || item.title.includes(keyword) || item.desc.includes(keyword)
                );
                renderNewsCards(filtered);
            }
        }

        // 頁面載入時自動執行即時更新拉取
        window.addEventListener('DOMContentLoaded', fetchIndustryNews);
    </script>
</body>
</html>
