<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>金牛頓企業入口網 | 公司活動行事曆</title>
    <!-- 網頁瀏覽器分頁小圖示 (Favicon) -->
    <link rel="icon" type="image/png" href="https://king-newton.github.io/dashboard/icon-standard.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; }
        body, html {
            margin: 0;
            padding: 0;
            height: 100vh;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f0f4f8;
            color: #334155;
            -webkit-tap-highlight-color: transparent;
        }

        /* 🌟 頂部固定區塊 */
        #top-header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 60px;
            background-color: #00a600;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 12px rgba(0, 166, 0, 0.2);
            z-index: 50;
            padding: 0 16px;
        }

        /* 🌟 中間整頁行事曆嵌入區塊 */
        #middle-container {
            position: absolute;
            top: 60px;
            bottom: 74px;
            left: 0;
            right: 0;
            background: #ffffff;
            overflow: hidden;
        }

        /* 🌟 底部固定 Dock 快捷列區塊 */
        #dock-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 74px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-top: 1px solid #e2e8f0;
            box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.08);
            z-index: 50;
            display: flex;
            align-items: center;
            justify-content: space-around;
            padding: 0 8px;
        }

        .app-box {
            width: 42px;
            height: 42px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            box-shadow: 0 3px 8px rgba(0,0,0,0.08);
        }

        /* 🔒 身份驗證遮罩 Modal */
        #auth-modal {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(8px);
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }
    </style>
</head>
<body>

    <!-- 🔒 1. 身份驗證彈窗遮罩 (雙重確認：工號 + 姓名) -->
    <div id="auth-modal">
        <div class="bg-white rounded-3xl p-6 md:p-8 w-full max-w-sm shadow-2xl border border-slate-100 text-center space-y-4">
            <div class="w-14 h-14 bg-emerald-100 text-[#00a600] rounded-2xl flex items-center justify-center mx-auto text-xl shadow-sm">
                <i class="fa-solid fa-lock"></i>
            </div>
            
            <div>
                <h2 class="text-lg font-extrabold text-slate-800 m-0">金牛頓公司入口網</h2>
                <p class="text-xs text-slate-500 mt-1 m-0">請輸入您的工號與姓名進行身份確認</p>
            </div>

            <form onsubmit="verifyEmp(event)" class="space-y-3">
                <div>
                    <input type="text" id="emp-id-input" placeholder="請輸入工號 (例如: E020)" required autofocus autocomplete="off" class="w-full bg-slate-50 border border-slate-200 text-center text-sm py-2.5 px-4 rounded-xl outline-none focus:border-[#00a600] focus:bg-white transition">
                </div>
                <div>
                    <input type="text" id="emp-name-input" placeholder="請輸入您的姓名" required autocomplete="off" class="w-full bg-slate-50 border border-slate-200 text-center text-sm py-2.5 px-4 rounded-xl outline-none focus:border-[#00a600] focus:bg-white transition">
                </div>

                <div id="auth-msg" class="text-xs font-bold text-rose-500 min-h-[16px]"></div>

                <button type="submit" id="verify-btn" class="w-full bg-[#00a600] hover:bg-[#008f00] text-white font-bold py-3 rounded-xl shadow-lg shadow-emerald-600/30 transition cursor-pointer text-sm">
                    確認並登入系統
                </button>
            </form>
        </div>
    </div>

    <!-- 2. 頂部固定 Header (僅保留雙 LOGO) -->
    <header id="top-header">
        <div class="flex items-center justify-center w-full max-w-xl px-2">
            <div class="flex items-center gap-3">
                <img src="https://king-newton.github.io/dashboard/icon-standard.png" alt="Icon" class="h-7 w-auto object-contain rounded bg-white/15 p-0.5 shadow-sm">
                <img src="https://king-newton.github.io/dashboard/logo-standard.png" alt="Logo" class="h-7 w-auto object-contain rounded bg-white/15 p-0.5 shadow-sm">
            </div>
        </div>
    </header>

    <!-- 3. 中間嵌入整頁行事曆 -->
    <main id="middle-container">
        <iframe src="https://o936157111-ops.github.io/company-calendar/" title="公司活動行事曆" class="w-full h-full border-0"></iframe>
    </main>

    <!-- 4. 底部固定 Dock 快捷列 -->
    <nav id="dock-bar">
        <div class="flex items-center justify-around w-full max-w-xl">
            <a href="https://king-newton.github.io/dashboard/punchinout.html" target="_blank" class="flex flex-col items-center justify-center text-decoration-none group">
                <div class="app-box bg-gradient-to-br from-green-500 to-emerald-700 text-white">
                    <i class="fa-solid fa-location-dot"></i>
                </div>
                <span class="text-[10px] text-slate-700 font-semibold mt-0.5">出勤打卡</span>
            </a>
            <a href="https://king-newton.github.io/dashboard/leave.html" target="_blank" class="flex flex-col items-center justify-center text-decoration-none group">
                <div class="app-box bg-gradient-to-br from-amber-400 to-yellow-600 text-white">
                    <i class="fa-solid fa-table"></i>
                </div>
                <span class="text-[10px] text-slate-700 font-semibold mt-0.5">請假單</span>
            </a>
            <a href="https://king-newton.github.io/portaly/King-Newton.html" target="_blank" class="flex flex-col items-center justify-center text-decoration-none group">
                <div class="app-box bg-gradient-to-br from-sky-500 to-blue-700 text-white">
                    <i class="fa-solid fa-building"></i>
                </div>
                <span class="text-[10px] text-slate-700 font-semibold mt-0.5">公司資訊</span>
            </a>
            <a href="https://o936157111-ops.github.io/company-calendar/" target="_blank" class="flex flex-col items-center justify-center text-decoration-none group">
                <div class="app-box bg-gradient-to-br from-pink-500 to-rose-700 text-white">
                    <i class="fa-solid fa-calendar-days"></i>
                </div>
                <span class="text-[10px] text-slate-700 font-semibold mt-0.5">活動行事曆</span>
            </a>
        </div>
    </nav>

    <script>
        // 工號與姓名清單 CSV 網址
        const EMP_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQsSgTxCHRQ0C1bGVPDauhJYlxqurA4ZTa34QQhG3Moh83AxU4zpr_QD4pX9VG6q6Hkj8M9T8j_hqc1/pub?gid=0&single=true&output=csv";

        // 初始化檢查登入狀態
        function checkAuthStatus() {
            const isAuth = localStorage.getItem('king_newton_auth');
            if (isAuth === 'true') {
                document.getElementById('auth-modal').style.display = 'none';
            }
        }

        // 驗證工號與姓名（使用 CORS 代理繞過阻擋）
        async function verifyEmp(e) {
            e.preventDefault();
            const inputId = document.getElementById('emp-id-input').value.trim().toUpperCase();
            const inputName = document.getElementById('emp-name-input').value.trim();
            const msgDiv = document.getElementById('auth-msg');
            const verifyBtn = document.getElementById('verify-btn');

            if (!inputId || !inputName) {
                msgDiv.innerText = "請完整輸入工號與姓名！";
                return;
            }

            msgDiv.innerText = "";
            verifyBtn.innerText = "驗證中...";
            verifyBtn.disabled = true;

            try {
                // 透過 api.allorigins 代理請求，解決 GitHub Pages 讀取 Google Sheets 的 CORS 限制
                const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(EMP_CSV_URL)}`;
                const response = await fetch(proxyUrl);
                const data = await response.json();
                
                if (!data.contents) {
                    throw new Error("無法取得試算表內容");
                }

                const csvText = data.contents;
                const rows = csvText.split(/\r?\n/).map(row => row.split(','));
                let isValid = false;

                for (let i = 0; i < rows.length; i++) {
                    const row = rows[i];
                    if (row.length >= 2) {
                        const sheetId = row[0].replaceAll('"', '').trim().toUpperCase();
                        const sheetName = row[1].replaceAll('"', '').trim();

                        if (sheetId === inputId && sheetName === inputName) {
                            isValid = true;
                            break;
                        }
                    }
                }

                if (isValid) {
                    localStorage.setItem('king_newton_auth', 'true');
                    localStorage.setItem('king_newton_emp_id', inputId);
                    localStorage.setItem('king_newton_emp_name', inputName);
                    document.getElementById('auth-modal').style.display = 'none';
                } else {
                    msgDiv.innerText = "❌ 工號與姓名不符或不存在，請重新輸入！";
                    document.getElementById('emp-id-input').value = "";
                    document.getElementById('emp-name-input').value = "";
                }
            } catch (error) {
                console.error("驗證失敗:", error);
                msgDiv.innerText = "⚠️ 網路連線或授權異常，請檢查試算表是否已公開發布。";
            } finally {
                verifyBtn.innerText = "確認並登入系統";
                verifyBtn.disabled = false;
            }
        }

        checkAuthStatus();
    </script>
</body>
</html>
