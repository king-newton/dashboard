<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>金牛頓企業管理入口網 | 公司活動行事曆</title>
    <!-- 網頁瀏覽器分頁小圖示 (Favicon) -->
    <link rel="icon" type="image/png" href="https://king-newton.github.io/dashboard/icon-standard.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; }
        body, html {
            margin: 0;
            padding: 0;
            height: 100vh;
            overflow: hidden; /* 鎖定全螢幕，防止頁面整體滾動 */
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f0f4f8;
            color: #334155;
            -webkit-tap-highlight-color: transparent;
        }

        /* 🌟 頂部固定區塊：改為 space-side，讓 LOGO 靠左、EXIT 靠右，絕不重疊 */
        #top-header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 60px;
            background-color: #00a600;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 4px 12px rgba(0, 166, 0, 0.2);
            z-index: 50;
            padding: 0 16px;
            user-select: none;
            -webkit-user-select: none;
        }

        /* 🌟 中間整頁行事曆嵌入區塊 */
        #middle-container {
            position: absolute;
            top: 60px;
            bottom: 74px;
            left: 0;
            right: 0;
            background: #ffffff;
            overflow: hidden;
        }

        /* 🌟 底部固定 Dock 快捷列區塊 */
        #dock-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 74px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-top: 1px solid #e2e8f0;
            box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.08);
            z-index: 50;
            display: flex;
            align-items: center;
            justify-content: space-around;
            padding: 0 8px;
        }

        .app-box {
            width: 42px;
            height: 42px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            box-shadow: 0 3px 8px rgba(0,0,0,0.08);
        }

        /* 🔒 身份驗證遮罩 Modal */
        #auth-modal {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(8px);
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }
    </style>
</head>
<body>

    <!-- 🔒 1. 身份驗證彈窗遮罩 (雙重確認：工號 + 姓名) -->
    <div id="auth-modal">
        <div class="bg-white rounded-3xl p-6 md:p-8 w-full max-w-sm shadow-2xl border border-slate-100 text-center space-y-4">
            <div class="w-14 h-14 bg-emerald-100 text-[#00a600] rounded-2xl flex items-center justify-center mx-auto text-xl shadow-sm">
                <i class="fa-solid fa-lock"></i>
            </div>
            
            <div>
                <h2 class="text-lg font-extrabold text-slate-800 m-0">金牛頓公司入口網</h2>
                <p class="text-xs text-slate-500 mt-1 m-0">請輸入您的工號與姓名進行身份確認</p>
            </div>

            <form onsubmit="verifyEmp(event)" class="space-y-3">
                <div>
                    <input type="text" id="emp-id-input" placeholder="請輸入工號" required autofocus autocomplete="off" class="w-full bg-slate-50 border border-slate-200 text-center text-sm py-2.5 px-4 rounded-xl outline-none focus:border-[#00a600] focus:bg-white transition">
                </div>
                <div>
                    <input type="text" id="emp-name-input" placeholder="請輸入姓名" required autocomplete="off" class="w-full bg-slate-50 border border-slate-200 text-center text-sm py-2.5 px-4 rounded-xl outline-none focus:border-[#00a600] focus:bg-white transition">
                </div>

                <div id="auth-msg" class="text-xs font-bold text-rose-500 min-h-[16px]"></div>

                <button type="submit" id="verify-btn" class="w-full bg-[#00a600] hover:bg-[#008f00] text-white font-bold py-3 rounded-xl shadow-lg shadow-emerald-600/30 transition cursor-pointer text-sm">
                    確認並登入系統
                </button>
            </form>
        </div>
    </div>

    <!-- 2. 頂部固定 Header (左側 LOGO 靠齊 + 右側 EXIT 按鈕，手機版完美適配) -->
    <header id="top-header">
        <!-- 左側 LOGO 區塊（支援長按 2 秒清除登入重設） -->
        <div id="logout-trigger" class="flex items-center cursor-pointer py-1" title="長按 2 秒可清除登入狀態重新驗證">
            <div class="flex items-center gap-2">
                <img src="https://king-newton.github.io/dashboard/icon-standard.png" alt="Icon" class="h-7 w-auto object-contain rounded bg-white/15 p-0.5 shadow-sm">
                <img src="https://king-newton.github.io/dashboard/logo-standard.png" alt="Logo" class="h-7 w-auto object-contain rounded bg-white/15 p-0.5 shadow-sm">
            </div>
        </div>

        <!-- 右側 EXIT 登出按鈕 -->
        <button onclick="logoutSystem()" class="bg-white/20 hover:bg-white/30 text-white border border-white/40 px-3 py-1.5 rounded-lg text-xs font-bold transition flex items-center gap-1 cursor-pointer shadow-sm">
            <i class="fa-solid fa-right-from-bracket"></i> EXIT
        </button>
    </header>

    <!-- 3. 中間嵌入整頁行事曆 -->
    <main id="middle-container">
        <iframe src="https://king-newton.github.io/company-calendar/" title="公司活動行事曆" class="w-full h-full border-0"></iframe>
    </main>

    <!-- 4. 底部固定 Dock 快捷列 -->
    <nav id="dock-bar">
        <div class="flex items-center justify-around w-full max-w-xl">
            <a href="https://king-newton.github.io/dashboard/punchinout.html" target="_blank" class="flex flex-col items-center justify-center text-decoration-none group">
                <div class="app-box bg-gradient-to-br from-green-500 to-emerald-700 text-white">
                    <i class="fa-solid fa-location-dot"></i>
                </div>
                <span class="text-[10px] text-slate-700 font-semibold mt-0.5">出勤打卡</span>
            </a>
            <a href="https://king-newton.github.io/dashboard/leave.html" target="_blank" class="flex flex-col items-center justify-center text-decoration-none group">
                <div class="app-box bg-gradient-to-br from-amber-400 to-yellow-600 text-white">
                    <i class="fa-solid fa-table"></i>
                </div>
                <span class="text-[10px] text-slate-700 font-semibold mt-0.5">請假單</span>
            </a>
            <a href="https://chat.whatsapp.com/Dvu3lyXMlnWG7lkb1lLkR5" target="_blank" class="flex flex-col items-center justify-center text-decoration-none group">
                <div class="app-box bg-gradient-to-br from-sky-500 to-blue-700 text-white">
                    <i class="fa-solid fa-building"></i>
                </div>
                <span class="text-[10px] text-slate-700 font-semibold mt-0.5">每日上班行程匯報</span>
            </a>
            <a href="https://king-newton.github.io/company-calendar/index.html" target="_blank" class="flex flex-col items-center justify-center text-decoration-none group">
                <div class="app-box bg-gradient-to-br from-pink-500 to-rose-700 text-white">
                    <i class="fa-solid fa-calendar-days"></i>
                </div>
                <span class="text-[10px] text-slate-700 font-semibold mt-0.5">活動行事曆</span>
            </a>
        </div>
    </nav>

    <script>
        // 內建員工工號與姓名對照表
        const EMPLOYEE_LIST = [
            { id: "E001", name: "李彥綸" },
            { id: "E002", name: "楊添仰" },
            { id: "E003", name: "陳品鈞" },
            { id: "E005", name: "陳秀燕" },
            { id: "E006", name: "高欣宜" },
            { id: "E011", name: "余品橋" },
            { id: "E012", name: "陳慧真" },
            { id: "E020", name: "ERIC" },
            { id: "E023", name: "陳靖昂" },
            { id: "E026", name: "何成偉" },
            { id: "E029", name: "李佩娟" },
            { id: "E033", name: "曾晨杰" },
            { id: "E035", name: "戴政宏" },
            { id: "E036", name: "詹淑敏" }
        ];

        // 初始化檢查登入狀態
        function checkAuthStatus() {
            const isAuth = localStorage.getItem('king_newton_auth');
            if (isAuth === 'true') {
                document.getElementById('auth-modal').style.display = 'none';
            }
        }

        // 本地前端立即驗證工號與姓名
        function verifyEmp(e) {
            e.preventDefault();
            const inputId = document.getElementById('emp-id-input').value.trim().toUpperCase();
            const inputName = document.getElementById('emp-name-input').value.trim().toUpperCase();
            const msgDiv = document.getElementById('auth-msg');

            if (!inputId || !inputName) {
                msgDiv.innerText = "請完整輸入工號與姓名！";
                return;
            }

            const matchedEmp = EMPLOYEE_LIST.find(emp => 
                emp.id.toUpperCase() === inputId && emp.name.toUpperCase() === inputName
            );

            if (matchedEmp) {
                localStorage.setItem('king_newton_auth', 'true');
                localStorage.setItem('king_newton_emp_id', matchedEmp.id);
                localStorage.setItem('king_newton_emp_name', matchedEmp.name);
                document.getElementById('auth-modal').style.display = 'none';
            } else {
                msgDiv.innerText = "❌ 工號與姓名不符，請重新輸入！";
                document.getElementById('emp-id-input').value = "";
                document.getElementById('emp-name-input').value = "";
            }
        }

        // 主動點擊 EXIT 按鈕登出
        function logoutSystem() {
            if (confirm("確定要登出系統並清除目前的登入身分嗎？")) {
                localStorage.removeItem('king_newton_auth');
                localStorage.removeItem('king_newton_emp_id');
                localStorage.removeItem('king_newton_emp_name');
                location.reload();
            }
        }

        // 長按頂部 LOGO 2 秒清除登入紀錄並重整
        let pressTimer = null;
        const logoutTrigger = document.getElementById('logout-trigger');

        const startPress = () => {
            pressTimer = setTimeout(() => {
                logoutSystem();
            }, 2000); // 2秒
        };

        const cancelPress = () => {
            clearTimeout(pressTimer);
        };

        logoutTrigger.addEventListener('mousedown', startPress);
        logoutTrigger.addEventListener('touchstart', startPress);
        logoutTrigger.addEventListener('mouseup', cancelPress);
        logoutTrigger.addEventListener('mouseleave', cancelPress);
        logoutTrigger.addEventListener('touchend', cancelPress);

        checkAuthStatus();
    </script>
</body>
</html>
